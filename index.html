<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Youth Earner's - Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="intro-running bg-black text-white">

    <div id="logoIntro" aria-label="Youth Earner's logo introduction">
        <div class="intro-stage">
            <div class="logo-wrap"><img class="intro-logo" src="youth-earners-logo.png" alt="Youth Earner's" /></div>
            <div class="intro-line"></div>
            <p class="intro-title">Youth Earner's</p>
        </div>
    </div>

    <div id="authContainer" class="hidden auth-wrapper">
        <div class="form-container">
            <img class="auth-logo" src="youth-earners-logo.png" alt="Logo" />
            <form id="loginForm" class="auth-form">
                <h2>Welcome Back</h2>
                <div class="input-group"><input type="tel" id="loginNumber" placeholder="Enter your mobile number" pattern="[0-9]{10}" maxlength="10" required></div>
                <div class="input-group"><input type="password" id="loginPassword" placeholder="Password (content 6 digit)" minlength="6" required></div>
                <button type="submit" id="loginBtn" class="auth-btn">Log In</button>
                <p class="switch-form">New user? <span id="showRegister">Sign in (Register)</span></p>
            </form>
            <form id="registerForm" class="auth-form hidden">
                <h2>Create Account</h2>
                <div class="input-group"><input type="text" id="regName" placeholder="Full Name" required></div>
                <div class="input-group"><input type="tel" id="regNumber" placeholder="Enter your mobile number" pattern="[0-9]{10}" maxlength="10" required></div>
                <div class="input-group"><input type="password" id="regPassword" placeholder="Password (content 6 digit)" minlength="6" required></div>
                <button type="submit" id="regBtn" class="auth-btn">Register</button>
                <p class="switch-form">Already have an account? <span id="showLogin">Log In</span></p>
            </form>
        </div>
    </div>

    <main id="website" class="hidden"><div id="root"></div></main>

    <script type="module" src="app.js"></script>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('home'); 
            const [isPlaying, setIsPlaying] = useState(false); 
            
            const [userProfile, setUserProfile] = useState({ name: 'Player', number: '9999999999', avatar: 'youth-earners-logo.png' });
            const [wallet, setWallet] = useState(0);
            
            // Pop-up and Matchmaking States
            const [confirmPopup, setConfirmPopup] = useState(null); 
            const [isMatchmaking, setIsMatchmaking] = useState(false);
            const [matchTime, setMatchTime] = useState(20);
            const [matchFound, setMatchFound] = useState(false);
            const [opponent, setOpponent] = useState({ name: 'Searching...', img: 'youth-earners-logo.png' });
            
            // REALTIME FIREBASE STATES
            const [roomId, setRoomId] = useState(null);
            const [playerRole, setPlayerRole] = useState(null); // 1 = Creator, 2 = Joiner
            const [roomData, setRoomData] = useState(null);
            const [currentBet, setCurrentBet] = useState(0);
            const [bidInput, setBidInput] = useState('');
            
            const fileInputRef = useRef(null);
            const playTiers = [{ entry: 5, win: 9 }, { entry: 10, win: 18 }, { entry: 15, win: 27 }, { entry: 20, win: 36 }];

            useEffect(() => {
                const handleGameStart = (e) => {
                    const data = e.detail;
                    if(data) {
                        setUserProfile(prev => ({ ...prev, name: data.name || 'Player', number: data.number || 'N/A' }));
                        if(data.wallet !== undefined) setWallet(data.wallet);
                    }
                };
                window.addEventListener('gameStart', handleGameStart);
                return () => window.removeEventListener('gameStart', handleGameStart);
            }, []);

            // ---- FIREBASE MATCHMAKING LOGIC ----
            const confirmPlay = async () => {
                if (wallet < confirmPopup.entry) {
                    alert("Low Balance! Please deposit money to play.");
                    setConfirmPopup(null); setActiveTab('wallet'); return;
                }
                const tier = confirmPopup;
                setConfirmPopup(null);
                setMatchFound(false); setMatchTime(20); setIsMatchmaking(true); setCurrentBet(tier.entry);

                try {
                    const q = window.fs.query(window.fs.collection(window.db, "rooms"), window.fs.where("tier", "==", tier.entry), window.fs.where("status", "==", "waiting"));
                    const querySnapshot = await window.fs.getDocs(q);

                    if (!querySnapshot.empty) {
                        const roomDoc = querySnapshot.docs[0];
                        await window.fs.updateDoc(window.fs.doc(window.db, "rooms", roomDoc.id), {
                            status: 'playing',
                            p2: { uid: window.auth.currentUser.uid, name: userProfile.name, img: userProfile.avatar }
                        });
                        setRoomId(roomDoc.id); setPlayerRole(2);
                    } else {
                        const docRef = await window.fs.addDoc(window.fs.collection(window.db, "rooms"), {
                            tier: tier.entry, status: 'waiting',
                            p1: { uid: window.auth.currentUser.uid, name: userProfile.name, img: userProfile.avatar },
                            p1Bid: null, p2Bid: null, round: 1, p1Tokens: 500, p2Tokens: 500, p1Wins: 0, p2Wins: 0, lastResult: null
                        });
                        setRoomId(docRef.id); setPlayerRole(1);
                    }
                } catch(e) { alert("Error connecting to server!"); setIsMatchmaking(false); }
            };

            // ---- REALTIME LISTENER FOR ROOM ----
            useEffect(() => {
                if (!roomId) return;
                const unsub = window.fs.onSnapshot(window.fs.doc(window.db, "rooms", roomId), async (doc) => {
                    const data = doc.data();
                    if(!data) return;
                    setRoomData(data);

                    if(data.status === 'playing' && !matchFound) {
                        setMatchFound(true);
                        setOpponent(playerRole === 1 ? data.p2 : data.p1);
                        setTimeout(() => {
                            setWallet(prev => prev - data.tier); 
                            setIsMatchmaking(false); setIsPlaying(true); setBidInput('');
                        }, 3000);
                    }

                    if(data.status === 'finished') {
                        setIsPlaying(false); setRoomId(null);
                        let isWinner = false;
                        if(data.p1Wins > data.p2Wins || (data.p1Wins === data.p2Wins && data.p1Tokens > data.p2Tokens)) {
                            isWinner = playerRole === 1;
                        } else if(data.p2Wins > data.p1Wins || (data.p2Wins === data.p1Wins && data.p2Tokens > data.p1Tokens)) {
                            isWinner = playerRole === 2;
                        } else {
                            isWinner = 'draw';
                        }
                        
                        if(isWinner === true) {
                            let winnings = data.tier * 1.8;
                            setWallet(prev => prev + winnings);
                            alert(`You Won! Winnings: ₹${winnings}`);
                        } else if(isWinner === 'draw') {
                            setWallet(prev => prev + data.tier);
                            alert("Match Draw! Entry fee refunded.");
                        } else {
                            alert("You Lost! Better luck next time.");
                        }
                    }

                    if(data.status === 'playing' && data.p1Bid !== null && data.p2Bid !== null && !data.lastResult) {
                        if(playerRole === 1) {
                            let p1T = data.p1Tokens - data.p1Bid; let p2T = data.p2Tokens - data.p2Bid;
                            let p1W = data.p1Wins; let p2W = data.p2Wins;
                            let winner = "DRAW";
                            if(data.p1Bid > data.p2Bid) { winner = data.p1.name; p1W++; }
                            else if(data.p2Bid > data.p1Bid) { winner = data.p2.name; p2W++; }
                            
                            let nextRound = data.round + 1;
                            await window.fs.updateDoc(window.fs.doc(window.db, "rooms", roomId), {
                                p1Tokens: p1T, p2Tokens: p2T, p1Wins: p1W, p2Wins: p2W,
                                lastResult: { p1Bid: data.p1Bid, p2Bid: data.p2Bid, winner }
                            });

                            setTimeout(async () => {
                                if(nextRound > 3) {
                                    await window.fs.updateDoc(window.fs.doc(window.db, "rooms", roomId), { status: 'finished' });
                                } else {
                                    await window.fs.updateDoc(window.fs.doc(window.db, "rooms", roomId), { p1Bid: null, p2Bid: null, round: nextRound, lastResult: null });
                                }
                            }, 3500);
                        }
                    }
                });
                return () => unsub();
            }, [roomId, matchFound, playerRole]);

            useEffect(() => {
                let timer;
                if (isMatchmaking && !matchFound) {
                    timer = setInterval(async () => {
                        setMatchTime(prev => {
                            if(prev <= 1) {
                                clearInterval(timer);
                                setIsMatchmaking(false);
                                alert("No real player found right now. Try again!");
                                if(playerRole === 1 && roomId) { window.fs.deleteDoc(window.fs.doc(window.db, "rooms", roomId)); }
                                setRoomId(null);
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [isMatchmaking, matchFound, roomId, playerRole]);


            const submitBid = async () => {
                if(!roomId || !roomData) return;
                let myTokens = playerRole === 1 ? roomData.p1Tokens : roomData.p2Tokens;
                let b = parseInt(bidInput);
                if(isNaN(b) || b < 0) b = 0; if(b > myTokens) b = myTokens;
                
                await window.fs.updateDoc(window.fs.doc(window.db, "rooms", roomId), {
                    [playerRole === 1 ? 'p1Bid' : 'p2Bid']: b
                });
            };

            const handleImageUpload = (e) => { const file = e.target.files[0]; if (file) { setUserProfile(prev => ({ ...prev, avatar: URL.createObjectURL(file) })); } };
            const handleDeposit = () => { const a = prompt("Enter deposit amount (₹):"); if(a > 0) setWallet(prev => prev + parseFloat(a)); };
            const handleWithdraw = () => { const a = prompt(`Withdraw (Max ₹${wallet}):`); if(a > 0 && a <= wallet) setWallet(prev => prev - parseFloat(a)); };

            // ---------------- MATCHMAKING UI ---------------- //
            if (isMatchmaking) {
                return (
                    <div className="fixed inset-0 z-[100] bg-[#050505] text-white flex flex-col items-center pt-20 px-6">
                        <div className="absolute top-10 w-full text-center">
                            <h2 className="text-[#ffe29a] text-xl font-bold tracking-widest">{matchFound ? "MATCH FOUND!" : "SEARCHING FOR PLAYERS..."}</h2>
                            {!matchFound && <p className="text-gray-400 text-sm mt-2">Timeout in: {matchTime}s</p>}
                        </div>
                        <div className="flex w-full justify-between items-center mt-24">
                            <div className="flex flex-col items-center">
                                <div className="w-24 h-24 rounded-full border-4 border-[#10b981] p-1 shadow-[0_0_20px_rgba(16,185,129,0.5)] bg-black">
                                    <img src={userProfile.avatar} className="w-full h-full rounded-full object-cover" />
                                </div>
                                <span className="font-bold mt-4 text-lg">{userProfile.name}</span>
                            </div>
                            <div className="text-4xl font-black text-[#dcae45] italic tracking-tighter drop-shadow-[0_0_10px_rgba(220,174,69,0.8)]">VS</div>
                            <div className="flex flex-col items-center">
                                <div className={`w-24 h-24 rounded-full border-4 p-1 bg-black ${matchFound ? 'border-red-500 shadow-[0_0_20px_rgba(239,68,68,0.5)]' : 'border-[#dcae45] border-dashed spin-slow'}`}>
                                    <img src={opponent.img} className={`w-full h-full rounded-full object-cover ${matchFound ? '' : 'animate-pulse opacity-50'}`} />
                                </div>
                                <span className="font-bold mt-4 text-lg">{opponent.name}</span>
                            </div>
                        </div>
                        <div className="absolute bottom-20 text-center">
                            <div className="text-gray-400">Entry: <span className="text-white font-bold">₹{currentBet}</span></div>
                            <div className="text-gray-400 mt-1">Prize Pool: <span className="text-emerald-400 font-bold text-xl">₹{currentBet * 1.8}</span></div>
                        </div>
                    </div>
                );
            }

            // ---------------- IN-GAME UI ---------------- //
            if (isPlaying && roomData) {
                let myData = playerRole === 1 ? roomData.p1 : roomData.p2;
                let oppData = playerRole === 1 ? roomData.p2 : roomData.p1;
                let myTokens = playerRole === 1 ? roomData.p1Tokens : roomData.p2Tokens;
                let oppTokens = playerRole === 1 ? roomData.p2Tokens : roomData.p1Tokens;
                let myBidStatus = playerRole === 1 ? roomData.p1Bid : roomData.p2Bid;

                return (
                    <div className="max-w-md mx-auto bg-black min-h-screen text-white p-4 flex flex-col relative pb-28">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-xl font-bold text-[#dcae45]"><i className="fa-solid fa-gamepad"></i> Game Running</h2>
                        </div>
                        <div className="flex justify-between items-center bg-dark-premium p-4 rounded-xl border border-gray-800 shadow-lg">
                            <div className="text-center w-1/3">
                                <img src={myData.img} className="w-10 h-10 rounded-full object-cover mx-auto mb-1 border-2 border-emerald-500 shadow-md"/>
                                <div className="text-2xl font-bold text-emerald-400">{myTokens}</div>
                            </div>
                            <div className="text-xl font-black text-[#dcae45] w-1/3 text-center">R{roomData.round}/3</div>
                            <div className="text-center w-1/3">
                                <img src={oppData.img} className="w-10 h-10 rounded-full object-cover mx-auto mb-1 border-2 border-rose-500 shadow-md"/>
                                <div className="text-2xl font-bold text-rose-400">{oppTokens}</div>
                            </div>
                        </div>
                        
                        {!roomData.lastResult ? (
                            <div className="mt-8">
                                {myBidStatus === null ? (
                                    <>
                                        <input type="number" value={bidInput} onChange={(e) => setBidInput(e.target.value)} className="w-full bg-[#111] border-2 border-[#dcae45] rounded-xl text-center text-4xl py-4 focus:outline-none focus:border-emerald-500 font-bold shadow-[0_0_15px_rgba(220,174,69,0.2)]" placeholder="Enter Bid" />
                                        <div className="flex gap-2 mt-4">
                                            <button onClick={() => setBidInput(Math.floor(myTokens/2))} className="flex-1 bg-[#222] border border-[#dcae45]/50 py-2 rounded-lg font-bold">1/2</button>
                                            <button onClick={() => setBidInput(myTokens)} className="flex-1 bg-[#222] border border-[#dcae45]/50 py-2 rounded-lg font-bold">Max</button>
                                        </div>
                                        <button onClick={submitBid} className="w-full mt-8 btn-gold-glow py-4 rounded-xl text-lg tracking-widest font-bold">LOCK BID</button>
                                    </>
                                ) : (
                                    <div className="text-center mt-16 animate-pulse text-[#dcae45] font-bold text-xl">Waiting for opponent to lock bid...</div>
                                )}
                            </div>
                        ) : (
                            <div className="mt-8 text-center pop-in">
                                <h3 className="text-xl font-bold mb-4">Round Result</h3>
                                <div className="flex justify-between text-2xl font-black mb-4">
                                    <span className="text-emerald-400">{playerRole === 1 ? roomData.lastResult.p1Bid : roomData.lastResult.p2Bid}</span>
                                    <span className="text-gray-500">vs</span>
                                    <span className="text-rose-400">{playerRole === 1 ? roomData.lastResult.p2Bid : roomData.lastResult.p1Bid}</span>
                                </div>
                                <div className="text-2xl text-[#ffe29a] font-bold mt-4 p-4 border border-[#dcae45] rounded-xl bg-[#111]">{roomData.lastResult.winner === 'DRAW' ? 'Round Tied!' : `${roomData.lastResult.winner} WON`}</div>
                            </div>
                        )}
                    </div>
                );
            }

            // 3. MAIN APP UI
            return (
                <div className="max-w-md mx-auto bg-black min-h-screen relative pb-24 shadow-2xl">
                    
                    {/* FIXED HEADER WITH FULL LOGO AND TEXT */}
                    <div className="flex justify-between items-center px-4 pt-4 pb-2 border-b border-gray-900">
                        <div className="flex items-center gap-2">
                            <img src="youth-earners-logo.png" style={{mixBlendMode:'screen'}} className="h-10 w-auto object-contain" alt="Logo" />
                            <span className="font-black text-[#ffe29a] text-[15px] tracking-wider uppercase">Youth Earners</span>
                        </div>
                        <div onClick={()=>setActiveTab('wallet')} className="bg-[#111] cursor-pointer border border-[#dcae45] px-3 py-1.5 rounded-full text-xs font-bold text-[#ffe29a] flex items-center gap-2 shadow-[0_0_10px_rgba(220,174,69,0.3)]">
                            <i className="fa-solid fa-wallet text-[#dcae45]"></i> ₹{wallet.toFixed(2)}
                        </div>
                    </div>

                    <div className="p-4">
                        {activeTab === 'home' && (
                            <div className="space-y-6">
                                {/* LARGER GOLD BANNER */}
                                <div className="w-full h-44 rounded-xl bg-gradient-to-br from-[#dcae45] via-[#a37d22] to-[#7a5912] p-6 flex flex-col justify-center items-start shadow-[0_4px_20px_rgba(220,174,69,0.3)] relative overflow-hidden">
                                    <i className="fa-solid fa-trophy text-8xl text-black/10 absolute right-4 top-4 transform rotate-12"></i>
                                    <div className="text-black relative z-10">
                                        <h3 className="font-black text-3xl mb-2">Youth Earner's</h3>
                                        <p className="text-sm font-bold opacity-90 tracking-wide">Play & Win Real Cash!</p>
                                    </div>
                                </div>

                                <div className="mt-6">
                                    <h3 className="font-bold mb-4 text-[#ffe29a] text-lg flex items-center gap-2"><i className="fa-solid fa-users"></i> Play with Real Players</h3>
                                    
                                    {/* 2-COLUMN GRID FOR GAMES */}
                                    <div className="grid grid-cols-2 gap-4">
                                        {playTiers.map(tier => (
                                            <div key={tier.entry} className="bg-dark-premium rounded-xl p-4 border border-gray-800 flex flex-col items-center text-center relative overflow-hidden hover:border-[#dcae45]/50 transition-colors">
                                                {/* Card Logo Image (Using same logo for now) */}
                                                <img src="youth-earners-logo.png" style={{mixBlendMode:'screen'}} className="h-10 w-auto mb-3 opacity-90 drop-shadow-[0_0_5px_rgba(220,174,69,0.5)]" alt="game-icon" />
                                                
                                                <div className="text-xs text-gray-400 mb-1">Entry: <span className="font-bold text-white text-sm">₹{tier.entry}</span></div>
                                                
                                                {/* Glowing Green Win Amount */}
                                                <div className="text-[16px] text-[#10b981] font-black mb-4 drop-shadow-[0_0_8px_rgba(16,185,129,0.8)] tracking-wide">
                                                    WIN: ₹{tier.win}
                                                </div>
                                                
                                                <button onClick={() => setConfirmPopup(tier)} className="w-full btn-green-glow py-2 rounded-lg font-bold text-sm tracking-wide shadow-[0_0_15px_rgba(16,185,129,0.4)]">
                                                    Play Now
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                        {activeTab === 'wallet' && (
                            <div className="space-y-6 pt-2">
                                <h2 className="text-2xl font-bold text-[#dcae45] text-center"><i className="fa-solid fa-vault"></i> My Wallet</h2>
                                <div className="bg-gradient-to-br from-[#1a1a1a] to-[#000] p-6 rounded-2xl border border-[#dcae45]/40 shadow-[0_10px_30px_rgba(220,174,69,0.15)] relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-[#dcae45] opacity-10 rounded-full blur-3xl"></div>
                                    <div className="text-gray-400 text-sm font-semibold">Total Balance</div>
                                    <div className="text-5xl font-black text-white my-3 tracking-wide drop-shadow-md">₹{wallet.toFixed(2)}</div>
                                    <div className="flex gap-4 mt-8">
                                        <button onClick={handleDeposit} className="flex-1 btn-green-glow py-3 rounded-xl font-bold text-lg shadow-lg"><i className="fa-solid fa-arrow-down"></i> Deposit</button>
                                        <button onClick={handleWithdraw} className="flex-1 bg-[#111] border border-gray-600 hover:border-[#dcae45] transition-colors py-3 rounded-xl font-bold text-lg text-white"><i className="fa-solid fa-arrow-up"></i> Withdraw</button>
                                    </div>
                                </div>
                            </div>
                        )}
                        {activeTab === 'profile' && (
                            <div className="space-y-6 text-center pt-8">
                                <div className="relative inline-block">
                                    <img src={userProfile.avatar} alt="Profile" className="w-28 h-28 rounded-full object-cover border-4 border-[#dcae45] p-1 mx-auto bg-black shadow-[0_0_20px_rgba(220,174,69,0.3)]" />
                                    <button onClick={() => fileInputRef.current.click()} className="absolute bottom-1 right-1 bg-[#dcae45] text-black w-8 h-8 flex items-center justify-center rounded-full border-2 border-black shadow-lg"><i className="fa-solid fa-camera"></i></button>
                                    <input type="file" ref={fileInputRef} onChange={handleImageUpload} accept="image/*" className="hidden" />
                                </div>
                                <div>
                                    <input type="text" value={userProfile.name} onChange={(e) => setUserProfile({...userProfile, name: e.target.value})} className="bg-transparent text-white text-3xl font-bold text-center border-b border-gray-800 focus:border-[#dcae45] focus:outline-none pb-2 w-64" />
                                    <p className="text-[#dcae45] mt-2 tracking-widest font-bold"><i className="fa-solid fa-phone text-xs"></i> +91 {userProfile.number}</p>
                                </div>
                            </div>
                        )}
                    </div>

                    {confirmPopup && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[70] backdrop-blur-sm px-4 pop-in">
                            <div className="bg-[#111] border border-[#dcae45] w-full max-w-sm rounded-2xl p-6 text-center shadow-[0_0_30px_rgba(220,174,69,0.2)]">
                                <div className="w-16 h-16 bg-gradient-to-tr from-[#dcae45] to-[#ffe29a] rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg text-black">
                                    <i className="fa-solid fa-coins text-3xl"></i>
                                </div>
                                <h2 className="text-2xl font-bold text-white mb-2">Confirm Match</h2>
                                <div className="bg-[#050505] rounded-xl p-4 my-4 flex justify-between items-center border border-gray-800">
                                    <div className="text-left"><div className="text-gray-400 text-xs">Entry Amount</div><div className="text-white font-bold text-lg">₹{confirmPopup.entry}</div></div>
                                    <div className="text-right"><div className="text-gray-400 text-xs">Winning Amount</div><div className="text-emerald-400 font-bold text-xl">₹{confirmPopup.win}</div></div>
                                </div>
                                <div className="flex gap-3 mt-6">
                                    <button onClick={() => setConfirmPopup(null)} className="flex-1 bg-transparent border border-gray-600 text-gray-300 py-3 rounded-xl font-bold hover:bg-gray-800">Cancel</button>
                                    <button onClick={confirmPlay} className="flex-1 btn-green-glow py-3 rounded-xl font-bold tracking-wide">Play Now</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#0a0a0a] border-t border-gray-900 flex justify-between items-center h-16 px-6 z-50 rounded-t-3xl shadow-[0_-5px_20px_rgba(0,0,0,0.9)]">
                        <button onClick={()=>setActiveTab('home')} className={`flex flex-col items-center gap-1 w-10 ${activeTab==='home'?'text-[#dcae45]':'text-gray-500'}`}><i className="fa-solid fa-house text-xl"></i><span className="text-[9px] font-bold">Home</span></button>
                        <button onClick={()=>setActiveTab('profile')} className={`flex flex-col items-center gap-1 w-10 ${activeTab==='profile'?'text-[#dcae45]':'text-gray-500'}`}><i className="fa-solid fa-user text-xl"></i><span className="text-[9px] font-bold">Profile</span></button>
                        <div className="relative -top-5">
                            <button onClick={()=>setActiveTab('wallet')} className={`w-14 h-14 rounded-full flex items-center justify-center border-4 border-[#0a0a0a] shadow-[0_0_15px_rgba(220,174,69,0.3)] transition-transform ${activeTab==='wallet'?'bg-gradient-to-b from-[#ffe29a] to-[#dcae45] text-black scale-105':'bg-[#111] text-[#dcae45]'}`}>
                                <i className="fa-solid fa-wallet text-2xl"></i>
                            </button>
                        </div>
                        <button onClick={() => alert('Support logic')} className="flex flex-col items-center gap-1 w-10 text-gray-500"><i className="fa-solid fa-headset text-xl"></i><span className="text-[9px] font-bold">Support</span></button>
                        <button onClick={() => alert('About logic')} className="flex flex-col items-center gap-1 w-10 text-gray-500"><i className="fa-solid fa-circle-info text-xl"></i><span className="text-[9px] font-bold">About</span></button>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
