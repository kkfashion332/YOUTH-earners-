<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Youth Earner's - Pro</title>
    
    <!-- External Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- PURI CSS YAHIN PAR HAI -->
    <style>
        :root { 
            --black: #000000; 
            --dark: #050505;  
            --gold: #dcae45; 
            --gold-light: #ffe29a; 
            --text: #f8fafc; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; min-height: 100%; background: var(--black); color: var(--text); font-family: 'Arial', sans-serif; }
        .hidden { display: none !important; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .bg-premium-dark {
            background: radial-gradient(ellipse at top, rgba(220, 174, 69, 0.15) 0%, transparent 60%),
                        radial-gradient(circle at bottom, rgba(220, 174, 69, 0.1) 0%, #000000 60%);
            background-color: var(--black);
        }

        .curved-header {
            background: linear-gradient(180deg, #050505 0%, #111 100%);
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            border-bottom: 1px solid rgba(220, 174, 69, 0.4);
            box-shadow: 0 4px 15px rgba(220,174,69,0.1);
        }

        body.intro-running { overflow: hidden; }
        #logoIntro { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; background: #000; transition: opacity 900ms ease; }
        .intro-logo { width: 200px; height: auto; animation: logoIn 1.5s forwards; }
        @keyframes logoIn { 0%{transform:scale(0.8); opacity:0;} 100%{transform:scale(1); opacity:1;} }

        .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .form-container { background: var(--dark); border: 1px solid rgba(220,174,69,0.3); border-radius: 20px; padding: 30px; width: 100%; max-width: 350px; text-align: center; }
        .input-group input { width: 100%; padding: 12px 15px; border-radius: 8px; background: #111; border: 1px solid rgba(220,174,69,0.3); color: white; margin-bottom: 15px; outline: none; }
        .input-group input:focus { border-color: var(--gold); }
        .auth-btn { width: 100%; padding: 12px; border-radius: 8px; background: linear-gradient(90deg, #dcae45, #ffe29a); color: #000; font-weight: bold; border: none; cursor: pointer; }

        .match-card { background: #111; border: 1px solid #333; border-radius: 12px; padding: 15px; text-align: center; transition: 0.3s; }
        .match-card:hover { border-color: #dcae45; }
        .btn-play-gold { background: linear-gradient(90deg, #dcae45, #ffe29a, #dcae45); background-size: 200% auto; color: #000; border: none; transition: 0.5s; font-weight: bold; }
        .btn-play-gold:hover { background-position: right center; }

        .spin-slow { animation: spin 3s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .pop-in { animation: popIn 0.2s ease-out forwards; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .pb-24 { padding-bottom: 6.5rem; }
    </style>
</head>
<body class="intro-running bg-premium-dark text-white">

    <!-- BGM & Sound Effects -->
    <audio id="bgm" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>
    <audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="winSound" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

    <div id="logoIntro">
        <div class="text-center">
            <img class="intro-logo mb-4" src="youth-earners-logo.png" alt="Youth Earner's" />
            <div class="text-xl font-bold text-[#dcae45] tracking-widest">YOUTH EARNERS</div>
        </div>
    </div>

    <!-- Auth Container -->
    <div id="authContainer" class="hidden auth-wrapper">
        <div class="form-container">
            <h2 class="text-2xl font-bold text-[#dcae45] mb-6">Login</h2>
            <form id="loginForm">
                <div class="input-group"><input type="tel" id="loginNumber" placeholder="Mobile Number" required></div>
                <div class="input-group"><input type="password" id="loginPassword" placeholder="Password" required></div>
                <button type="submit" id="loginBtn" class="auth-btn">Log In</button>
                <p class="mt-4 text-sm text-gray-400">New? <span id="showRegister" class="text-[#dcae45] cursor-pointer">Register Here</span></p>
            </form>
            <form id="registerForm" class="hidden">
                <div class="input-group"><input type="text" id="regName" placeholder="Full Name" required></div>
                <div class="input-group"><input type="tel" id="regNumber" placeholder="Mobile Number" required></div>
                <div class="input-group"><input type="password" id="regPassword" placeholder="Password" required></div>
                <button type="submit" id="regBtn" class="auth-btn">Register</button>
                <p class="mt-4 text-sm text-gray-400">Have account? <span id="showLogin" class="text-[#dcae45] cursor-pointer">Log In</span></p>
            </form>
        </div>
    </div>

    <main id="website" class="hidden"><div id="root"></div></main>

    <!-- FIREBASE & CORE JS LOGIC YAHAN HAI -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, addDoc, updateDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyA4pTWtUMbZFhrMORZibUhV7gpPRy6DreY",
          authDomain: "youth-earners-d34ca.firebaseapp.com",
          projectId: "youth-earners-d34ca",
          storageBucket: "youth-earners-d34ca.firebasestorage.app",
          messagingSenderId: "568087034965",
          appId: "1:568087034965:web:b4f79488d22db53af128dc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // REACT KO FIREBASE DENE KE LIYE (Global variables)
        window.db = db;
        window.auth = auth;
        window.fs = { doc, setDoc, getDoc, collection, query, where, getDocs, addDoc, updateDoc, onSnapshot, deleteDoc };

        const intro = document.getElementById("logoIntro");
        const authContainer = document.getElementById("authContainer");
        const gameWebsite = document.getElementById("website");
        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");
        const showRegisterBtn = document.getElementById("showRegister");
        const showLoginBtn = document.getElementById("showLogin");

        let isIntroFinished = false;
        let isUserLoggedIn = false;
        let fetchedUserData = null;

        // यूज़र का लॉगिन स्टेटस चेक करना
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                isUserLoggedIn = true;
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) { 
                    fetchedUserData = docSnap.data(); 
                } else { 
                    fetchedUserData = { name: "Player", number: user.email.replace("@youthearners.com", ""), wallet: 0 }; 
                }
            } else { 
                isUserLoggedIn = false; 
            }
            checkAndLoad();
        });

        // इंट्रो स्क्रीन का टाइमर (4.5 सेकंड)
        setTimeout(() => {
            isIntroFinished = true;
            checkAndLoad();
        }, 4500);

        // इंट्रो के बाद सही स्क्रीन लोड करने का फंक्शन
        function checkAndLoad() {
            if (!isIntroFinished) return;
            
            intro.classList.add("hidden");
            intro.style.display = "none";
            document.body.classList.remove("intro-running");
            
            if (isUserLoggedIn && fetchedUserData) { 
                launchGame(fetchedUserData); 
            } else { 
                authContainer.classList.remove("hidden"); 
            }
        }

        showRegisterBtn.addEventListener('click', () => { 
            loginForm.classList.add('hidden'); 
            registerForm.classList.remove('hidden'); 
        });

        showLoginBtn.addEventListener('click', () => { 
            registerForm.classList.add('hidden'); 
            loginForm.classList.remove('hidden'); 
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const number = document.getElementById('regNumber').value;
            const password = document.getElementById('regPassword').value;
            const regBtn = document.getElementById('regBtn');
            const dummyEmail = number + "@youthearners.com"; 
            
            try {
                regBtn.innerText = "Registering..."; 
                regBtn.disabled = true;
                const userCredential = await createUserWithEmailAndPassword(auth, dummyEmail, password);
                const user = userCredential.user;
                
                const userData = { uid: user.uid, name: name, number: number, wallet: 50 }; 
                await setDoc(doc(db, "users", user.uid), userData);
                
                alert("Registration Successful! Bonus ₹50 added.");
                regBtn.innerText = "Register"; 
                regBtn.disabled = false;
                launchGame(userData);
            } catch (error) {
                alert("Error: " + error.message);
                regBtn.innerText = "Register"; 
                regBtn.disabled = false;
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const number = document.getElementById('loginNumber').value;
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.getElementById('loginBtn');
            const dummyEmail = number + "@youthearners.com";
            
            try {
                loginBtn.innerText = "Logging in..."; 
                loginBtn.disabled = true;
                const userCredential = await signInWithEmailAndPassword(auth, dummyEmail, password);
                const user = userCredential.user;
                
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);
                
                let userData = { name: "Player", number: number, wallet: 0 };
                if (docSnap.exists()) { userData = docSnap.data(); }
                
                loginBtn.innerText = "Log In"; 
                loginBtn.disabled = false;
                launchGame(userData);
            } catch (error) {
                alert("Login failed! Check your number and password.");
                loginBtn.innerText = "Log In"; 
                loginBtn.disabled = false;
            }
        });

        function launchGame(userData) {
            authContainer.classList.add("hidden");
            gameWebsite.classList.remove("hidden");
            
            // Background Music Play
            const bgm = document.getElementById('bgm');
            if(bgm) { bgm.volume = 0.3; bgm.play().catch(e => console.log("Audio play blocked by browser until interaction.")); }
            
            const event = new CustomEvent('gameStart', { detail: userData });
            window.dispatchEvent(event);
        }
    </script>

    <!-- REACT APP LOGIC YAHAN HAI -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('home'); 
            const [userProfile, setUserProfile] = useState({ name: 'Player', number: '9999999999', avatar: 'youth-earners-logo.png' });
            const [wallet, setWallet] = useState(0);
            const [banners, setBanners] = useState([]);
            
            // Modals & States
            const [confirmPopup, setConfirmPopup] = useState(null); 
            const [isPlaying, setIsPlaying] = useState(false);
            const [isMatchmaking, setIsMatchmaking] = useState(false);
            const [matchTime, setMatchTime] = useState(20);
            
            // Leaderboard & History
            const [leaderboard, setLeaderboard] = useState([]);
            const [history, setHistory] = useState([]);
            const [chatMsg, setChatMsg] = useState("");

            // Hardcoded Tiers + Practice Mode
            const playTiers = [
                { entry: 0, win: 0, name: "Practice" },
                { entry: 5, win: 9 }, 
                { entry: 10, win: 18 }, 
                { entry: 15, win: 27 }, 
                { entry: 20, win: 36 }
            ];

            const playClick = () => { const a = document.getElementById('clickSound'); if(a) a.play().catch(()=>{}); };
            const playWin = () => { const a = document.getElementById('winSound'); if(a) a.play().catch(()=>{}); };

            useEffect(() => {
                const handleGameStart = (e) => {
                    if(e.detail) {
                        setUserProfile({ ...userProfile, name: e.detail.name, number: e.detail.number });
                        if(e.detail.wallet !== undefined) setWallet(e.detail.wallet);
                    }
                };
                window.addEventListener('gameStart', handleGameStart);

                setTimeout(() => {
                    if(window.fs && window.db) {
                        window.fs.onSnapshot(window.fs.collection(window.db, "banners"), (snap) => {
                            setBanners(snap.docs.map(doc => doc.data()));
                        });
                        window.fs.onSnapshot(window.fs.collection(window.db, "users"), (snap) => {
                            let users = snap.docs.map(doc => doc.data());
                            setLeaderboard(users.sort((a,b) => b.wallet - a.wallet).slice(0, 10));
                        });
                    }
                }, 2000);

                return () => window.removeEventListener('gameStart', handleGameStart);
            }, []);

            const getBadge = (amt) => amt > 500 ? '🥇 Gold' : amt > 100 ? '🥈 Silver' : '🥉 Bronze';

            const startMatch = (tier) => {
                playClick();
                if(tier.entry > 0 && wallet < tier.entry) {
                    alert("Low Balance!"); return;
                }
                setConfirmPopup(null);
                setIsMatchmaking(true);
                setMatchTime(5); 
                
                setTimeout(() => {
                    setIsMatchmaking(false);
                    setIsPlaying(true);
                    setMatchTime(20); // 20 Sec Game Timer
                    if(tier.entry > 0) setWallet(prev => prev - tier.entry);
                }, 5000);
            };

            if (isMatchmaking) {
                return (
                    <div className="fixed inset-0 bg-[#050505] text-white flex flex-col items-center justify-center z-50">
                        <div className="text-[#dcae45] text-2xl font-black mb-8 animate-pulse">SEARCHING PLAYERS...</div>
                        <div className="w-24 h-24 rounded-full border-4 border-[#dcae45] border-dashed spin-slow mb-4"></div>
                        <p>Time: {matchTime}s</p>
                    </div>
                );
            }

            if (isPlaying) {
                return (
                    <div className="fixed inset-0 bg-[#111] text-white flex flex-col items-center justify-center p-4 z-50">
                        <div className="w-full flex justify-between items-center mb-10 px-4">
                            <div className="text-center"><img src="youth-earners-logo.png" className="w-12 h-12 rounded-full border-2 border-emerald-500"/><p>{userProfile.name}</p></div>
                            <div className="text-3xl font-black text-[#dcae45]">VS</div>
                            <div className="text-center"><img src="youth-earners-logo.png" className="w-12 h-12 rounded-full border-2 border-rose-500"/><p>Opponent</p></div>
                        </div>
                        
                        <div className="text-5xl font-black text-white mb-8">{matchTime}s</div>
                        
                        <div className="absolute bottom-32 left-4 right-4 flex gap-2">
                            <input type="text" value={chatMsg} onChange={e=>setChatMsg(e.target.value)} placeholder="Say something..." className="flex-1 bg-black rounded-full px-4 border border-gray-600 outline-none" />
                            <button onClick={()=>setChatMsg('')} className="bg-[#dcae45] text-black w-10 h-10 rounded-full font-bold">💬</button>
                        </div>

                        <button onClick={() => { setIsPlaying(false); playWin(); setWallet(prev => prev + 10); alert("You Won!"); }} className="btn-play-gold py-4 px-10 rounded-full font-black text-xl absolute bottom-10">SIMULATE WIN</button>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto min-h-screen relative pb-24">
                    <div className="curved-header flex items-center justify-center py-3 relative z-10">
                        <img src="youth-earners-logo.png" style={{mixBlendMode:'screen'}} className="h-8 w-8 object-contain mr-2" alt="Logo" />
                        <div className="flex flex-col items-start">
                            <span className="font-black text-white text-[16px] tracking-widest leading-none">YOUTH EARNERS</span>
                        </div>
                    </div>

                    <div className="p-4 pt-6">
                        {activeTab === 'home' && (
                            <div className="space-y-6">
                                <div className="w-full h-40 rounded-2xl bg-[#111] border border-[#dcae45]/30 overflow-hidden flex items-center justify-center relative">
                                    {banners.length > 0 ? (
                                        <img src={banners[0].imageUrl} className="w-full h-full object-cover" />
                                    ) : (
                                        <div className="text-center p-4">
                                            <h3 className="text-xl font-bold text-[#dcae45]">Welcome to Youth Earners</h3>
                                            <p className="text-sm text-gray-400">Play & Win Real Cash!</p>
                                        </div>
                                    )}
                                </div>

                                <div>
                                    <h3 className="font-bold mb-4 text-white text-lg"><i className="fa-solid fa-gamepad text-[#dcae45]"></i> Select Game Mode</h3>
                                    <div className="grid grid-cols-2 gap-3">
                                        {playTiers.map((tier, idx) => (
                                            <div key={idx} className="match-card">
                                                <div className="text-gray-400 text-xs mb-1">{tier.entry === 0 ? 'Free Play' : 'Entry Fee'}</div>
                                                <div className="text-white font-bold mb-1">₹{tier.entry}</div>
                                                <div className="text-[#ffe29a] font-black text-lg mb-3">WIN: ₹{tier.win}</div>
                                                <button onClick={() => { playClick(); setConfirmPopup(tier); }} className="w-full btn-play-gold py-2 rounded-lg font-bold text-sm">Play Now</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'leaderboard' && (
                            <div>
                                <h2 className="text-xl font-bold text-[#dcae45] text-center mb-6"><i className="fa-solid fa-trophy"></i> Top Players</h2>
                                <div className="space-y-3">
                                    {leaderboard.map((user, idx) => (
                                        <div key={idx} className="bg-[#111] p-3 rounded-xl border border-gray-800 flex justify-between items-center">
                                            <div className="flex items-center gap-3">
                                                <div className="w-8 h-8 bg-[#dcae45] text-black font-bold rounded-full flex items-center justify-center">#{idx+1}</div>
                                                <span className="font-bold">{user.name}</span>
                                            </div>
                                            <span className="text-[#10b981] font-bold">₹{user.wallet}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'refer' && (
                            <div className="text-center pt-4">
                                <i className="fa-solid fa-gift text-6xl text-[#dcae45] mb-4"></i>
                                <h2 className="text-2xl font-black text-white mb-2">Refer & Earn</h2>
                                <p className="text-gray-400 mb-6">Invite friends and get ₹10 bonus instantly when they sign up!</p>
                                <div className="bg-[#111] border border-dashed border-[#dcae45] p-4 rounded-xl mb-4 text-xl font-bold text-[#ffe29a]">
                                    YOUTH{userProfile.number.substring(0,4)}
                                </div>
                                <button className="btn-play-gold py-3 px-8 rounded-full font-bold w-full"><i className="fa-solid fa-share-nodes"></i> Share Now</button>
                            </div>
                        )}

                        {activeTab === 'wallet' && (
                            <div className="space-y-6 pt-2">
                                <div className="bg-gradient-to-br from-[#1a1a1a] to-[#000] p-6 rounded-3xl border border-[#dcae45]/40 shadow-lg text-center">
                                    <div className="text-gray-400 text-sm font-semibold">Total Balance</div>
                                    <div className="text-5xl font-black text-white my-2">₹{wallet.toFixed(2)}</div>
                                    <div className="flex gap-4 mt-6">
                                        <button className="flex-1 btn-play-gold py-3 rounded-xl font-bold">Add Money</button>
                                        <button className="flex-1 border border-[#dcae45] text-[#dcae45] py-3 rounded-xl font-bold">Withdraw</button>
                                    </div>
                                </div>
                                
                                <h3 className="font-bold text-white mt-8"><i className="fa-solid fa-clock-rotate-left"></i> Transaction History</h3>
                                <div className="bg-[#111] p-4 rounded-xl text-center text-gray-500 text-sm">
                                    No recent transactions found.
                                </div>
                            </div>
                        )}

                        {activeTab === 'profile' && (
                            <div className="text-center pt-4">
                                <img src={userProfile.avatar} className="w-24 h-24 rounded-full border-4 border-[#dcae45] mx-auto mb-4 bg-black" />
                                <h2 className="text-2xl font-bold text-white">{userProfile.name}</h2>
                                <p className="text-gray-400 mb-2">{userProfile.number}</p>
                                <div className="inline-block bg-[#111] px-4 py-1 rounded-full border border-[#dcae45]/50 text-[#ffe29a] font-bold text-sm mb-6">
                                    {getBadge(wallet)} Tier
                                </div>
                                
                                <div className="space-y-3">
                                    <button className="w-full bg-[#111] border border-gray-800 p-4 rounded-xl flex justify-between font-bold text-left hover:border-[#dcae45]"><span className="text-white"><i className="fa-solid fa-headset w-6"></i> Support Tickets</span><i className="fa-solid fa-chevron-right text-gray-600"></i></button>
                                    <button className="w-full bg-[#111] border border-gray-800 p-4 rounded-xl flex justify-between font-bold text-left hover:border-[#dcae45]"><span className="text-white"><i className="fa-solid fa-circle-info w-6"></i> About Us</span><i className="fa-solid fa-chevron-right text-gray-600"></i></button>
                                </div>
                            </div>
                        )}
                    </div>

                    {confirmPopup && (
                        <div className="fixed inset-0 bg-black/80 z-[80] flex items-center justify-center p-4">
                            <div className="bg-[#050505] border border-[#dcae45]/50 w-full max-w-[260px] rounded-2xl p-5 pop-in text-center relative">
                                <div className="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-gradient-to-b from-[#ffe29a] to-[#dcae45] w-12 h-12 rounded-full flex items-center justify-center border-2 border-black shadow-lg">
                                    <i className="fa-solid fa-coins text-black text-xl"></i>
                                </div>
                                <h3 className="text-white font-bold tracking-widest mt-6 mb-4 text-sm">CONFIRM MATCH</h3>
                                
                                <div className="bg-[#111] border border-gray-800 rounded-xl p-3 mb-5">
                                    <div className="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Entry amount</div>
                                    <div className="text-white font-bold text-2xl mb-2">₹{confirmPopup.entry}</div>
                                    <div className="h-[1px] w-full bg-gray-800 my-2"></div>
                                    <div className="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Winning amount</div>
                                    <div className="text-[#ffe29a] font-black text-3xl">₹{confirmPopup.win}</div>
                                </div>
                                
                                <div className="flex gap-2 w-full">
                                    <button onClick={() => { playClick(); setConfirmPopup(null); }} className="flex-1 bg-[#111] border border-gray-600 text-gray-300 py-2.5 rounded-lg font-bold text-sm">Cancel</button>
                                    <button onClick={() => startMatch(confirmPopup)} className="flex-1 btn-play-gold py-2.5 rounded-lg font-bold text-sm text-black">PLAY NOW</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#050505] border-t border-[#dcae45]/30 flex justify-between items-center h-[70px] px-4 z-50 rounded-t-2xl shadow-[0_-5px_15px_rgba(0,0,0,0.8)]">
                        <button onClick={()=>{playClick(); setActiveTab('home');}} className={`flex flex-col items-center gap-1 w-[20%] ${activeTab==='home'?'text-[#dcae45]':'text-gray-500'}`}><i className="fa-solid fa-house text-xl"></i><span className="text-[9px] font-bold">Home</span></button>
                        <button onClick={()=>{playClick(); setActiveTab('leaderboard');}} className={`flex flex-col items-center gap-1 w-[20%] ${activeTab==='leaderboard'?'text-[#dcae45]':'text-gray-500'}`}><i className="fa-solid fa-chart-simple text-xl"></i><span className="text-[9px] font-bold">Ranks</span></button>
                        
                        <div className="relative -top-5 w-[20%] flex justify-center">
                            <button onClick={()=>{playClick(); setActiveTab('wallet');}} className={`w-14 h-14 rounded-full flex items-center justify-center border-4 border-[#050505] transition-transform ${activeTab==='wallet'?'bg-gradient-to-b from-[#ffe29a] to-[#dcae45] text-black scale-105':'bg-[#111] text-[#dcae45]'}`}>
                                <i className="fa-solid fa-wallet text-2xl"></i>
                            </button>
                        </div>
                        
                        <button onClick={()=>{playClick(); setActiveTab('refer');}} className={`flex flex-col items-center gap-1 w-[20%] ${activeTab==='refer'?'text-[#dcae45]':'text-gray-500'}`}><i className="fa-solid fa-gift text-xl"></i><span className="text-[9px] font-bold">Refer</span></button>
                        <button onClick={()=>{playClick(); setActiveTab('profile');}} className={`flex flex-col items-center gap-1 w-[20%] ${activeTab==='profile'?'text-[#dcae45]':'text-gray-500'}`}><i className="fa-solid fa-user text-xl"></i><span className="text-[9px] font-bold">Profile</span></button>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
