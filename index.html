<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Youth Earner's - Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="intro-running bg-black text-white">

    <div id="logoIntro" aria-label="Youth Earner's logo introduction">
        <div class="intro-stage">
            <div class="logo-wrap">
                <img class="intro-logo" src="youth-earners-logo.png" alt="Youth Earner's" />
            </div>
            <div class="intro-line"></div>
            <p class="intro-title">Youth Earner's</p>
        </div>
    </div>

    <div id="authContainer" class="hidden auth-wrapper">
        <div class="form-container">
            <img class="auth-logo" src="youth-earners-logo.png" alt="Logo" />
            <form id="loginForm" class="auth-form">
                <h2>Welcome Back</h2>
                <div class="input-group">
                    <input type="tel" id="loginNumber" placeholder="Enter your mobile number" pattern="[0-9]{10}" maxlength="10" required>
                </div>
                <div class="input-group">
                    <input type="password" id="loginPassword" placeholder="Password (content 6 digit)" minlength="6" required>
                </div>
                <button type="submit" id="loginBtn" class="auth-btn">Log In</button>
                <p class="switch-form">New user? <span id="showRegister">Sign in (Register)</span></p>
            </form>
            <form id="registerForm" class="auth-form hidden">
                <h2>Create Account</h2>
                <div class="input-group">
                    <input type="text" id="regName" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <input type="tel" id="regNumber" placeholder="Enter your mobile number" pattern="[0-9]{10}" maxlength="10" required>
                </div>
                <div class="input-group">
                    <input type="password" id="regPassword" placeholder="Password (content 6 digit)" minlength="6" required>
                </div>
                <button type="submit" id="regBtn" class="auth-btn">Register</button>
                <p class="switch-form">Already have an account? <span id="showLogin">Log In</span></p>
            </form>
        </div>
    </div>

    <main id="website" class="hidden">
        <div id="root"></div>
    </main>

    <script type="module" src="app.js"></script>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('home'); // home, about, wallet, support, profile
            const [isPlaying, setIsPlaying] = useState(false); // Game view toggle
            
            // User Data
            const [userProfile, setUserProfile] = useState({ name: 'Player', number: '9999999999', avatar: 'youth-earners-logo.png' });
            const [wallet, setWallet] = useState(50);
            
            // Matchmaking simulation state
            const [matchingTier, setMatchingTier] = useState(null);

            // Game States (Secret Bidder)
            const [round, setRound] = useState(1);
            const [playerTokens, setPlayerTokens] = useState(500);
            const [botTokens, setBotTokens] = useState(500);
            const [playerWins, setPlayerWins] = useState(0);
            const [botWins, setBotWins] = useState(0);
            const [bidInput, setBidInput] = useState('');
            const [timeLeft, setTimeLeft] = useState(15);
            const [roundResult, setRoundResult] = useState(null);
            const [currentBet, setCurrentBet] = useState(0);
            
            const fileInputRef = useRef(null);

            const playTiers = [
                { entry: 5, win: 9 },
                { entry: 10, win: 18 },
                { entry: 15, win: 27 },
                { entry: 20, win: 36 }
            ];

            useEffect(() => {
                const handleGameStart = (e) => {
                    const data = e.detail;
                    if(data) {
                        setUserProfile(prev => ({ ...prev, name: data.name || 'Player', number: data.number || 'N/A' }));
                        if(data.wallet !== undefined) setWallet(data.wallet);
                    }
                };
                window.addEventListener('gameStart', handleGameStart);
                return () => window.removeEventListener('gameStart', handleGameStart);
            }, []);

            // Matchmaking Function
            const startMatchmaking = (betAmount) => {
                if (wallet < betAmount) {
                    alert("Low Balance! Please add money to wallet.");
                    setActiveTab('wallet');
                    return;
                }
                setMatchingTier(betAmount);
                // Simulate waiting for a player, then starting game
                setTimeout(() => {
                    setMatchingTier(null);
                    setWallet(prev => prev - betAmount);
                    setCurrentBet(betAmount);
                    resetGameState();
                    setIsPlaying(true);
                }, 2000);
            };

            const resetGameState = () => {
                setRound(1); setPlayerTokens(500); setBotTokens(500);
                setPlayerWins(0); setBotWins(0); setBidInput('');
                setTimeLeft(15); setRoundResult(null);
            };

            // Image Upload Handler
            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setUserProfile(prev => ({ ...prev, avatar: URL.createObjectURL(file) }));
                }
            };

            // Game Timer Logic
            useEffect(() => {
                let timer;
                if (isPlaying && !roundResult && timeLeft > 0) {
                    timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                } else if (timeLeft === 0 && !roundResult) {
                    handleBidSubmit(true);
                }
                return () => clearInterval(timer);
            }, [timeLeft, isPlaying, roundResult]);

            const handleBidSubmit = (isTimeout = false) => {
                let pBid = isTimeout ? 0 : parseInt(bidInput);
                if (isNaN(pBid) || pBid < 0) pBid = 0;
                if (pBid > playerTokens) pBid = playerTokens;

                let bBid = round === 3 ? botTokens : Math.floor(Math.random() * Math.min(botTokens, pBid + 50));
                setPlayerTokens(prev => prev - pBid);
                setBotTokens(prev => prev - bBid);

                let winner = "DRAW";
                if (pBid > bBid) { winner = "PLAYER"; setPlayerWins(prev => prev + 1); } 
                else if (bBid > pBid) { winner = "BOT"; setBotWins(prev => prev + 1); }

                setRoundResult({ pBid, bBid, winner });

                setTimeout(() => {
                    if (round < 3) {
                        setRound(prev => prev + 1);
                        setBidInput(''); setTimeLeft(15); setRoundResult(null);
                    } else {
                        endGame(pBid, bBid, winner);
                    }
                }, 3000);
            };

            const endGame = (lastPBid, lastBBid, lastRoundWinner) => {
                let finalPlayerWins = playerWins + (lastRoundWinner === "PLAYER" ? 1 : 0);
                let finalBotWins = botWins + (lastRoundWinner === "BOT" ? 1 : 0);
                let matchStatus = "Draw";
                let winnings = 0;

                if (finalPlayerWins > finalBotWins || (finalPlayerWins === finalBotWins && playerTokens > botTokens)) {
                    matchStatus = "You Won!";
                    winnings = currentBet * 1.8;
                    setWallet(prev => prev + winnings);
                } else if (finalBotWins > finalPlayerWins) {
                    matchStatus = "You Lost!";
                }
                alert(`Match Over! ${matchStatus} (Winnings: ₹${winnings})`);
                setIsPlaying(false);
            };

            // ---------------- COMPONENT VIEWS ---------------- //

            if (isPlaying) {
                return (
                    <div className="max-w-md mx-auto bg-black min-h-screen text-white p-4 flex flex-col">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-xl font-bold text-[#dcae45]">Game Running</h2>
                            <span className={`font-bold ${timeLeft <= 5 ? 'text-red-500' : 'text-emerald-400'}`}>00:{timeLeft < 10 ? '0'+timeLeft : timeLeft}</span>
                        </div>
                        <div className="flex justify-between items-center bg-gray-900 p-4 rounded-xl border border-gray-700 shadow-inner">
                            <div className="text-center w-1/3">
                                <div className="text-xs text-slate-400 uppercase">You</div>
                                <div className="text-2xl font-bold text-emerald-400">{playerTokens}</div>
                            </div>
                            <div className="text-xl font-black text-slate-600 w-1/3 text-center">R{round}/3</div>
                            <div className="text-center w-1/3">
                                <div className="text-xs text-slate-400 uppercase">Opponent</div>
                                <div className="text-2xl font-bold text-rose-400">{botTokens}</div>
                            </div>
                        </div>
                        
                        {!roundResult ? (
                            <div className="mt-8">
                                <input type="number" value={bidInput} onChange={(e) => setBidInput(e.target.value)} className="w-full bg-gray-800 border-2 border-gray-600 rounded-xl text-center text-4xl py-4 focus:outline-none focus:border-emerald-500 font-bold" placeholder="Enter Bid" />
                                <div className="flex gap-2 mt-4">
                                    <button onClick={() => setBidInput(Math.floor(playerTokens/2))} className="flex-1 bg-gray-700 py-2 rounded-lg font-bold">1/2</button>
                                    <button onClick={() => setBidInput(playerTokens)} className="flex-1 bg-gray-700 py-2 rounded-lg font-bold">Max</button>
                                </div>
                                <button onClick={() => handleBidSubmit(false)} className="w-full mt-6 btn-green-glow py-4 rounded-xl font-bold text-lg">Lock Bid</button>
                            </div>
                        ) : (
                            <div className="mt-8 text-center animate-pulse">
                                <h3 className="text-xl font-bold mb-4">Round Result</h3>
                                <div className="flex justify-between text-2xl font-black mb-4">
                                    <span className="text-emerald-400">{roundResult.pBid}</span>
                                    <span className="text-slate-500">vs</span>
                                    <span className="text-rose-400">{roundResult.bBid}</span>
                                </div>
                                <div className="text-lg text-[#ffe29a]">{roundResult.winner === 'DRAW' ? 'Tied!' : `${roundResult.winner} WON`}</div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto bg-black min-h-screen relative pb-24 shadow-2xl">
                    
                    {/* Header (Visible on Home & Profile) */}
                    <div className="flex justify-between items-center p-4">
                        <img src="youth-earners-logo.png" style={{mixBlendMode:'screen'}} className="h-10 w-auto" alt="Logo" />
                        <div className="bg-gray-800 border border-[#dcae45] px-3 py-1 rounded-full text-sm font-bold text-[#ffe29a]">
                            ₹{wallet.toFixed(2)}
                        </div>
                    </div>

                    <div className="p-4">
                        {/* ---------------- HOME TAB ---------------- */}
                        {activeTab === 'home' && (
                            <div className="space-y-6">
                                {/* Banner */}
                                <div className="w-full h-32 rounded-xl bg-gradient-to-r from-[#dcae45] to-[#7c5b16] p-4 flex items-center justify-between shadow-lg shadow-yellow-900/20">
                                    <div className="text-black">
                                        <h3 className="font-black text-xl">Youth Earner's</h3>
                                        <p className="text-sm font-bold opacity-80">Play & Win Real Cash!</p>
                                    </div>
                                </div>

                                {/* Practice VS Bot */}
                                <div className="bg-gray-900 p-4 rounded-xl border border-gray-800 flex items-center justify-between">
                                    <div>
                                        <h4 className="font-bold text-[#ffe29a]">Practice vs Bot</h4>
                                        <p className="text-xs text-gray-400">Free to play, train your skills</p>
                                    </div>
                                    <button onClick={() => { setCurrentBet(0); resetGameState(); setIsPlaying(true); }} className="btn-green-glow px-6 py-2 rounded-lg font-bold text-sm">Play</button>
                                </div>

                                {/* Real Player Games (Horizontal Scroll) */}
                                <div>
                                    <h3 className="font-bold mb-3 text-gray-300">Play with Real Players</h3>
                                    <div className="flex gap-4 overflow-x-auto hide-scrollbar pb-4">
                                        {playTiers.map(tier => (
                                            <div key={tier.entry} className="min-w-[140px] bg-gray-900 border border-gray-700 rounded-xl p-4 text-center shrink-0">
                                                <div className="text-xs text-gray-400 mb-1">Entry Fee</div>
                                                <div className="font-bold text-lg text-white mb-2">₹{tier.entry}</div>
                                                <div className="text-xs text-emerald-400 font-bold mb-4">WIN ₹{tier.win}</div>
                                                <button 
                                                    onClick={() => startMatchmaking(tier.entry)} 
                                                    disabled={matchingTier === tier.entry}
                                                    className={`w-full py-2 rounded-lg font-bold text-sm ${matchingTier === tier.entry ? 'bg-gray-600 text-white matching-text' : 'btn-green-glow'}`}
                                                >
                                                    {matchingTier === tier.entry ? 'Matching...' : 'Play'}
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ---------------- WALLET TAB ---------------- */}
                        {activeTab === 'wallet' && (
                            <div className="space-y-4">
                                <h2 className="text-2xl font-bold text-[#dcae45] text-center mb-6">My Wallet</h2>
                                <div className="bg-gray-900 p-6 rounded-xl text-center border border-gray-800">
                                    <div className="text-gray-400 text-sm">Total Balance</div>
                                    <div className="text-4xl font-bold text-white my-2">₹{wallet.toFixed(2)}</div>
                                    <div className="flex gap-4 mt-6">
                                        <button className="flex-1 bg-emerald-600 py-2 rounded-lg font-bold">Deposit</button>
                                        <button className="flex-1 bg-gray-700 py-2 rounded-lg font-bold border border-gray-600">Withdraw</button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-4 mt-4">
                                    <button className="bg-gray-900 border border-gray-800 py-3 rounded-lg text-sm text-gray-300">Deposit History</button>
                                    <button className="bg-gray-900 border border-gray-800 py-3 rounded-lg text-sm text-gray-300">Withdrawal History</button>
                                </div>
                            </div>
                        )}

                        {/* ---------------- PROFILE TAB ---------------- */}
                        {activeTab === 'profile' && (
                            <div className="space-y-6 text-center pt-8">
                                <div className="relative inline-block">
                                    <img src={userProfile.avatar} alt="Profile" className="w-24 h-24 rounded-full object-cover border-2 border-[#dcae45] p-1 mx-auto" />
                                    <button onClick={() => fileInputRef.current.click()} className="absolute bottom-0 right-0 bg-[#dcae45] text-black text-xs font-bold px-2 py-1 rounded-full border-2 border-black">Edit</button>
                                    <input type="file" ref={fileInputRef} onChange={handleImageUpload} accept="image/*" className="hidden" />
                                </div>
                                
                                <div>
                                    <input 
                                        type="text" 
                                        value={userProfile.name} 
                                        onChange={(e) => setUserProfile({...userProfile, name: e.target.value})}
                                        className="bg-transparent text-white text-2xl font-bold text-center border-b border-gray-700 focus:border-[#dcae45] focus:outline-none pb-1 w-48"
                                    />
                                    <p className="text-gray-400 mt-2 tracking-widest">{userProfile.number}</p>
                                </div>

                                <div className="bg-gray-900 border border-gray-800 rounded-xl p-4 text-left mt-8 space-y-4">
                                    <div className="border-b border-gray-800 pb-3 text-gray-300">Security Settings</div>
                                    <div className="border-b border-gray-800 pb-3 text-gray-300">Help & Support</div>
                                    <div className="text-red-400 font-bold">Logout</div>
                                </div>
                            </div>
                        )}

                        {/* ---------------- ABOUT TAB ---------------- */}
                        {activeTab === 'about' && (
                            <div className="bg-gray-900 border border-gray-800 p-6 rounded-xl mt-4">
                                <h2 className="text-xl font-bold text-[#dcae45] mb-4">About Youth Earner's</h2>
                                <p className="text-gray-400 text-sm leading-relaxed mb-4">
                                    Welcome to Youth Earner's, India's premier skill-based gaming platform. We believe in empowering the youth by providing a safe, secure, and competitive environment to test your bidding strategies and win real rewards.
                                </p>
                                <p className="text-gray-400 text-sm leading-relaxed">
                                    100% Secure. Instant Withdrawals. 24/7 Support.
                                </p>
                            </div>
                        )}

                        {/* ---------------- SUPPORT TAB ---------------- */}
                        {activeTab === 'support' && (
                            <div className="text-center pt-10">
                                <h2 className="text-2xl font-bold text-white mb-2">Need Help?</h2>
                                <p className="text-gray-400 mb-8 text-sm">Our support team is available 24/7</p>
                                <button className="bg-[#25D366] text-white font-bold py-3 px-8 rounded-full shadow-lg shadow-green-900/50 flex items-center justify-center gap-2 mx-auto">
                                    <span>Chat on WhatsApp</span>
                                </button>
                                <p className="text-gray-500 text-xs mt-6">Email: support@youthearners.com</p>
                            </div>
                        )}
                    </div>

                    {/* BOTTOM NAVIGATION BAR */}
                    <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-gray-900 border-t border-gray-800 flex justify-around items-center py-3 px-2 z-50">
                        {['home', 'about', 'wallet', 'support', 'profile'].map(tab => (
                            <button 
                                key={tab} 
                                onClick={() => setActiveTab(tab)}
                                className={`flex flex-col items-center p-2 rounded-lg transition-colors ${activeTab === tab ? 'text-[#dcae45]' : 'text-gray-500 hover:text-gray-300'}`}
                            >
                                <div className={`text-xs font-bold capitalize ${activeTab === tab ? 'scale-110' : ''}`}>{tab}</div>
                            </button>
                        ))}
                    </div>

                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
