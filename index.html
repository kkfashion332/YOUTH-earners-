<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Bidder - Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [view, setView] = useState('lobby'); // lobby, game, wallet, history
            const [wallet, setWallet] = useState(50); // Starting with ₹50 bonus
            const [history, setHistory] = useState([]);
            const [transactions, setTransactions] = useState([{ type: 'DEPOSIT', amount: 50, date: new Date().toLocaleString() }]);
            const [currentBet, setCurrentBet] = useState(0);

            // Game States
            const [round, setRound] = useState(1);
            const [playerTokens, setPlayerTokens] = useState(500);
            const [botTokens, setBotTokens] = useState(500);
            const [playerWins, setPlayerWins] = useState(0);
            const [botWins, setBotWins] = useState(0);
            const [bidInput, setBidInput] = useState('');
            const [timeLeft, setTimeLeft] = useState(15);
            const [roundResult, setRoundResult] = useState(null); // Shows who won the round

            // Betting Tiers
            const betTiers = [5, 10, 15, 20];

            const startGame = (betAmount) => {
                if (wallet < betAmount) {
                    alert("Low Balance! Please add money to wallet.");
                    setView('wallet');
                    return;
                }
                setWallet(prev => prev - betAmount);
                addTransaction('GAME_FEE', -betAmount);
                setCurrentBet(betAmount);
                resetGameState();
                setView('game');
            };

            const resetGameState = () => {
                setRound(1);
                setPlayerTokens(500);
                setBotTokens(500);
                setPlayerWins(0);
                setBotWins(0);
                setBidInput('');
                setTimeLeft(15);
                setRoundResult(null);
            };

            const addTransaction = (type, amount) => {
                setTransactions([{ type, amount, date: new Date().toLocaleString() }, ...transactions]);
            };

            // Timer Logic
            useEffect(() => {
                let timer;
                if (view === 'game' && !roundResult && timeLeft > 0) {
                    timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                } else if (timeLeft === 0 && !roundResult) {
                    handleBidSubmit(true); // Auto-submit on timeout
                }
                return () => clearInterval(timer);
            }, [timeLeft, view, roundResult]);

            const handleBidSubmit = (isTimeout = false) => {
                let pBid = isTimeout ? 0 : parseInt(bidInput);
                if (isNaN(pBid) || pBid < 0) pBid = 0;
                if (pBid > playerTokens) pBid = playerTokens;

                // Bot Logic: Random bid based on tokens left and round
                let bBid = 0;
                if (round === 3) {
                    bBid = botTokens; // All-in on last round
                } else {
                    const maxBotBid = Math.min(botTokens, pBid + 50); // Dynamic bot strategy
                    bBid = Math.floor(Math.random() * maxBotBid);
                }

                setPlayerTokens(prev => prev - pBid);
                setBotTokens(prev => prev - bBid);

                let winner = "DRAW";
                if (pBid > bBid) {
                    winner = "PLAYER";
                    setPlayerWins(prev => prev + 1);
                } else if (bBid > pBid) {
                    winner = "BOT";
                    setBotWins(prev => prev + 1);
                }

                setRoundResult({ pBid, bBid, winner });

                // Move to next round or end game after a delay
                setTimeout(() => {
                    if (round < 3) {
                        setRound(prev => prev + 1);
                        setBidInput('');
                        setTimeLeft(15);
                        setRoundResult(null);
                    } else {
                        endGame(pBid, bBid, winner);
                    }
                }, 3000);
            };

            const endGame = (lastPBid, lastBBid, lastRoundWinner) => {
                let finalPlayerWins = playerWins + (lastRoundWinner === "PLAYER" ? 1 : 0);
                let finalBotWins = botWins + (lastRoundWinner === "BOT" ? 1 : 0);
                
                let matchStatus = "Draw";
                let winnings = 0;

                if (finalPlayerWins > finalBotWins || (finalPlayerWins === finalBotWins && playerTokens > botTokens)) {
                    matchStatus = "You Won!";
                    winnings = currentBet * 1.8; // 20% platform fee simulation
                    setWallet(prev => prev + winnings);
                    addTransaction('GAME_WIN', winnings);
                } else if (finalBotWins > finalPlayerWins) {
                    matchStatus = "Bot Won!";
                }

                setHistory([{ 
                    date: new Date().toLocaleString(), 
                    bet: currentBet, 
                    status: matchStatus, 
                    winAmount: winnings 
                }, ...history]);

                alert(`Match Over! ${matchStatus} (Winnings: ₹${winnings})`);
                setView('lobby');
            };

            // Components
            const Navbar = () => (
                <div className="flex justify-between items-center bg-slate-800 p-4 shadow-md rounded-b-xl">
                    <h1 className="text-xl font-bold text-emerald-400">BidMaster Pro</h1>
                    <div className="flex gap-4">
                        <button onClick={() => setView('wallet')} className="text-sm font-semibold bg-slate-700 px-3 py-1 rounded-lg">₹{wallet.toFixed(2)}</button>
                        <button onClick={() => setView('history')} className="text-sm font-semibold bg-slate-700 px-3 py-1 rounded-lg">History</button>
                    </div>
                </div>
            );

            return (
                <div className="max-w-md mx-auto bg-slate-900 min-h-screen shadow-2xl relative flex flex-col">
                    <Navbar />

                    <div className="p-4 flex-1 overflow-y-auto hide-scrollbar">
                        {/* LOBBY VIEW */}
                        {view === 'lobby' && (
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-xl text-center shadow-lg border border-slate-700">
                                    <h2 className="text-2xl font-bold text-white mb-2">Play vs Bot</h2>
                                    <p className="text-slate-400 text-sm mb-6">Select your entry amount. Winner takes 1.8x!</p>
                                    
                                    <div className="grid grid-cols-2 gap-4">
                                        {betTiers.map(bet => (
                                            <button 
                                                key={bet}
                                                onClick={() => startGame(bet)}
                                                className="bg-emerald-600 hover:bg-emerald-500 transition-colors p-4 rounded-xl font-bold text-lg shadow-md"
                                            >
                                                Play ₹{bet}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="text-center text-slate-500 text-xs">
                                    Real player matchmaking requires a backend server. Bot mode is active.
                                </div>
                            </div>
                        )}

                        {/* GAME VIEW */}
                        {view === 'game' && (
                            <div className="flex flex-col h-full space-y-4">
                                <div className="flex justify-between items-center bg-slate-800 p-3 rounded-lg border border-slate-700">
                                    <span className="font-semibold">Round {round} / 3</span>
                                    <span className={`font-bold ${timeLeft <= 5 ? 'text-red-500' : 'text-emerald-400'}`}>00:{timeLeft < 10 ? '0'+timeLeft : timeLeft}</span>
                                </div>

                                <div className="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-inner">
                                    <div className="text-center w-1/3">
                                        <div className="text-xs text-slate-400 uppercase">You</div>
                                        <div className="text-2xl font-bold text-emerald-400">{playerTokens}</div>
                                        <div className="text-xs mt-1 bg-slate-700 rounded-full px-2">Wins: {playerWins}</div>
                                    </div>
                                    <div className="text-2xl font-black text-slate-600 w-1/3 text-center">VS</div>
                                    <div className="text-center w-1/3">
                                        <div className="text-xs text-slate-400 uppercase">Bot</div>
                                        <div className="text-2xl font-bold text-rose-400">{botTokens}</div>
                                        <div className="text-xs mt-1 bg-slate-700 rounded-full px-2">Wins: {botWins}</div>
                                    </div>
                                </div>

                                {/* Bidding Area */}
                                {!roundResult ? (
                                    <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 flex-1 flex flex-col justify-center">
                                        <label className="text-center text-slate-300 mb-4 block">Enter your secret bid</label>
                                        <input 
                                            type="number" 
                                            value={bidInput}
                                            onChange={(e) => setBidInput(e.target.value)}
                                            className="w-full bg-slate-900 border-2 border-slate-600 rounded-xl text-center text-4xl py-4 focus:outline-none focus:border-emerald-500 transition-colors font-bold"
                                            placeholder="0"
                                        />
                                        <div className="flex gap-2 mt-4">
                                            <button onClick={() => setBidInput(Math.floor(playerTokens/2))} className="flex-1 bg-slate-700 py-2 rounded-lg text-sm font-bold">1/2</button>
                                            <button onClick={() => setBidInput(playerTokens)} className="flex-1 bg-slate-700 py-2 rounded-lg text-sm font-bold">Max</button>
                                        </div>
                                        <button 
                                            onClick={() => handleBidSubmit(false)}
                                            className="w-full mt-6 bg-emerald-600 hover:bg-emerald-500 py-4 rounded-xl font-bold text-lg shadow-[0_0_15px_rgba(5,150,105,0.4)]"
                                        >
                                            Lock Bid
                                        </button>
                                    </div>
                                ) : (
                                    <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 flex-1 flex flex-col justify-center items-center text-center animate-pulse">
                                        <h3 className="text-xl font-bold mb-6">Round Result</h3>
                                        <div className="flex justify-between w-full mb-6 text-2xl font-black">
                                            <span className="text-emerald-400">{roundResult.pBid}</span>
                                            <span className="text-slate-500">vs</span>
                                            <span className="text-rose-400">{roundResult.bBid}</span>
                                        </div>
                                        <div className="text-lg">
                                            {roundResult.winner === 'DRAW' ? 'Round Tied!' : `${roundResult.winner} WINS ROUND`}
                                        </div>
                                        <div className="text-sm text-slate-400 mt-4">Next round starting...</div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* WALLET VIEW */}
                        {view === 'wallet' && (
                            <div className="space-y-4">
                                <button onClick={() => setView('lobby')} className="text-slate-400 mb-4">&larr; Back to Lobby</button>
                                <div className="bg-slate-800 p-6 rounded-xl text-center shadow-lg border border-slate-700">
                                    <div className="text-slate-400 text-sm">Total Balance</div>
                                    <div className="text-4xl font-bold text-emerald-400 my-2">₹{wallet.toFixed(2)}</div>
                                    <div className="flex gap-4 mt-6">
                                        <button onClick={() => { setWallet(prev => prev + 100); addTransaction('DEPOSIT', 100); }} className="flex-1 bg-emerald-600 py-2 rounded-lg font-bold">Deposit ₹100</button>
                                        <button onClick={() => alert('Withdrawal request sent (Mock)')} className="flex-1 bg-slate-700 py-2 rounded-lg font-bold">Withdraw</button>
                                    </div>
                                </div>
                                <h3 className="font-bold text-slate-300 mt-6 mb-2">Transactions</h3>
                                <div className="space-y-2">
                                    {transactions.map((t, i) => (
                                        <div key={i} className="flex justify-between bg-slate-800 p-3 rounded-lg border border-slate-700 text-sm">
                                            <div>
                                                <div className="font-bold">{t.type}</div>
                                                <div className="text-xs text-slate-400">{t.date}</div>
                                            </div>
                                            <div className={`font-bold flex items-center ${t.amount > 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                                {t.amount > 0 ? '+' : ''}{t.amount}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* HISTORY VIEW */}
                        {view === 'history' && (
                            <div className="space-y-4">
                                <button onClick={() => setView('lobby')} className="text-slate-400 mb-4">&larr; Back to Lobby</button>
                                <h2 className="text-2xl font-bold text-white mb-4">Match History</h2>
                                {history.length === 0 ? (
                                    <div className="text-center text-slate-500 mt-10">No matches played yet.</div>
                                ) : (
                                    history.map((h, i) => (
                                        <div key={i} className="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-3 shadow-md">
                                            <div className="flex justify-between items-center mb-2">
                                                <span className="text-xs text-slate-400">{h.date}</span>
                                                <span className="bg-slate-700 px-2 py-1 rounded text-xs font-bold">Entry: ₹{h.bet}</span>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className={`font-bold ${h.status === 'You Won!' ? 'text-emerald-400' : h.status === 'Bot Won!' ? 'text-rose-400' : 'text-slate-300'}`}>{h.status}</span>
                                                {h.winAmount > 0 && <span className="font-bold text-emerald-400">+₹{h.winAmount.toFixed(2)}</span>}
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
