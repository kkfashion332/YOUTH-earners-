<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Youth Earner's - Pro</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="intro-running bg-black text-white">

    <div id="logoIntro" aria-label="Youth Earner's logo introduction">
        <div class="intro-stage">
            <div class="logo-wrap">
                <img class="intro-logo" src="youth-earners-logo.png" alt="Youth Earner's" />
            </div>
            <div class="intro-line"></div>
            <p class="intro-title">Youth Earner's</p>
        </div>
    </div>

    <div id="authContainer" class="hidden auth-wrapper">
        <div class="form-container">
            <img class="auth-logo" src="youth-earners-logo.png" alt="Logo" />
            <form id="loginForm" class="auth-form">
                <h2>Welcome Back</h2>
                <div class="input-group">
                    <input type="tel" id="loginNumber" placeholder="Enter your mobile number" pattern="[0-9]{10}" maxlength="10" required>
                </div>
                <div class="input-group">
                    <input type="password" id="loginPassword" placeholder="Password (content 6 digit)" minlength="6" required>
                </div>
                <button type="submit" id="loginBtn" class="auth-btn">Log In</button>
                <p class="switch-form">New user? <span id="showRegister">Sign in (Register)</span></p>
            </form>
            <form id="registerForm" class="auth-form hidden">
                <h2>Create Account</h2>
                <div class="input-group">
                    <input type="text" id="regName" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <input type="tel" id="regNumber" placeholder="Enter your mobile number" pattern="[0-9]{10}" maxlength="10" required>
                </div>
                <div class="input-group">
                    <input type="password" id="regPassword" placeholder="Password (content 6 digit)" minlength="6" required>
                </div>
                <button type="submit" id="regBtn" class="auth-btn">Register</button>
                <p class="switch-form">Already have an account? <span id="showLogin">Log In</span></p>
            </form>
        </div>
    </div>

    <main id="website" class="hidden">
        <div id="root"></div>
    </main>

    <script type="module" src="app.js"></script>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('home'); 
            const [isPlaying, setIsPlaying] = useState(false); 
            
            const [userProfile, setUserProfile] = useState({ name: 'Player', number: '9999999999', avatar: 'youth-earners-logo.png' });
            const [wallet, setWallet] = useState(50);
            
            const [matchingTier, setMatchingTier] = useState(null);

            const [round, setRound] = useState(1);
            const [playerTokens, setPlayerTokens] = useState(500);
            const [botTokens, setBotTokens] = useState(500);
            const [playerWins, setPlayerWins] = useState(0);
            const [botWins, setBotWins] = useState(0);
            const [bidInput, setBidInput] = useState('');
            const [timeLeft, setTimeLeft] = useState(15);
            const [roundResult, setRoundResult] = useState(null);
            const [currentBet, setCurrentBet] = useState(0);
            
            const fileInputRef = useRef(null);

            const playTiers = [
                { entry: 5, win: 9 },
                { entry: 10, win: 18 },
                { entry: 15, win: 27 },
                { entry: 20, win: 36 }
            ];

            useEffect(() => {
                const handleGameStart = (e) => {
                    const data = e.detail;
                    if(data) {
                        setUserProfile(prev => ({ ...prev, name: data.name || 'Player', number: data.number || 'N/A' }));
                        if(data.wallet !== undefined) setWallet(data.wallet);
                    }
                };
                window.addEventListener('gameStart', handleGameStart);
                return () => window.removeEventListener('gameStart', handleGameStart);
            }, []);

            const startMatchmaking = (betAmount) => {
                if (wallet < betAmount) {
                    alert("Low Balance! Please add money to your wallet to play.");
                    setActiveTab('wallet');
                    return;
                }
                setMatchingTier(betAmount);
                setTimeout(() => {
                    setMatchingTier(null);
                    setWallet(prev => prev - betAmount);
                    setCurrentBet(betAmount);
                    resetGameState();
                    setIsPlaying(true);
                }, 2000);
            };

            const resetGameState = () => {
                setRound(1); setPlayerTokens(500); setBotTokens(500);
                setPlayerWins(0); setBotWins(0); setBidInput('');
                setTimeLeft(15); setRoundResult(null);
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) { setUserProfile(prev => ({ ...prev, avatar: URL.createObjectURL(file) })); }
            };

            // Wallet Functions
            const handleDeposit = () => {
                const amount = prompt("Enter deposit amount (₹):");
                if(amount && !isNaN(amount) && amount > 0) {
                    setWallet(prev => prev + parseFloat(amount));
                    alert(`₹${amount} deposited successfully!`);
                }
            };

            const handleWithdraw = () => {
                const amount = prompt(`Enter withdrawal amount (Max ₹${wallet}):`);
                if(amount && !isNaN(amount) && amount > 0 && amount <= wallet) {
                    setWallet(prev => prev - parseFloat(amount));
                    alert(`₹${amount} withdrawn successfully! Money will reflect in your account shortly.`);
                } else if(amount > wallet) {
                    alert("Insufficient balance!");
                }
            };

            // Game Engine
            useEffect(() => {
                let timer;
                if (isPlaying && !roundResult && timeLeft > 0) {
                    timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                } else if (timeLeft === 0 && !roundResult) {
                    handleBidSubmit(true);
                }
                return () => clearInterval(timer);
            }, [timeLeft, isPlaying, roundResult]);

            const handleBidSubmit = (isTimeout = false) => {
                let pBid = isTimeout ? 0 : parseInt(bidInput);
                if (isNaN(pBid) || pBid < 0) pBid = 0;
                if (pBid > playerTokens) pBid = playerTokens;
                let bBid = round === 3 ? botTokens : Math.floor(Math.random() * Math.min(botTokens, pBid + 50));
                
                setPlayerTokens(prev => prev - pBid); setBotTokens(prev => prev - bBid);

                let winner = "DRAW";
                if (pBid > bBid) { winner = "PLAYER"; setPlayerWins(prev => prev + 1); } 
                else if (bBid > pBid) { winner = "BOT"; setBotWins(prev => prev + 1); }

                setRoundResult({ pBid, bBid, winner });

                setTimeout(() => {
                    if (round < 3) {
                        setRound(prev => prev + 1); setBidInput(''); setTimeLeft(15); setRoundResult(null);
                    } else { endGame(pBid, bBid, winner); }
                }, 3000);
            };

            const endGame = (lastPBid, lastBBid, lastRoundWinner) => {
                let finalPlayerWins = playerWins + (lastRoundWinner === "PLAYER" ? 1 : 0);
                let finalBotWins = botWins + (lastRoundWinner === "BOT" ? 1 : 0);
                let matchStatus = "Draw";
                let winnings = 0;

                if (finalPlayerWins > finalBotWins || (finalPlayerWins === finalBotWins && playerTokens > botTokens)) {
                    matchStatus = "You Won!"; winnings = currentBet * 1.8; setWallet(prev => prev + winnings);
                } else if (finalBotWins > finalPlayerWins) { matchStatus = "You Lost!"; }
                
                alert(`Match Over! ${matchStatus} (Winnings: ₹${winnings})`);
                setIsPlaying(false);
            };

            // ---------------- COMPONENT VIEWS ---------------- //
            if (isPlaying) {
                return (
                    <div className="max-w-md mx-auto bg-black min-h-screen text-white p-4 flex flex-col relative pb-28">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-xl font-bold text-[#dcae45]"><i className="fa-solid fa-gamepad"></i> Game Running</h2>
                            <span className={`font-bold ${timeLeft <= 5 ? 'text-red-500' : 'text-emerald-400'}`}>00:{timeLeft < 10 ? '0'+timeLeft : timeLeft}</span>
                        </div>
                        <div className="flex justify-between items-center bg-dark-premium p-4 rounded-xl">
                            <div className="text-center w-1/3">
                                <div className="text-xs text-gray-400 uppercase">You</div>
                                <div className="text-2xl font-bold text-emerald-400">{playerTokens}</div>
                            </div>
                            <div className="text-xl font-black text-[#dcae45] w-1/3 text-center">R{round}/3</div>
                            <div className="text-center w-1/3">
                                <div className="text-xs text-gray-400 uppercase">Opponent</div>
                                <div className="text-2xl font-bold text-rose-400">{botTokens}</div>
                            </div>
                        </div>
                        
                        {!roundResult ? (
                            <div className="mt-8">
                                <input type="number" value={bidInput} onChange={(e) => setBidInput(e.target.value)} className="w-full bg-[#111] border-2 border-[#dcae45] rounded-xl text-center text-4xl py-4 focus:outline-none focus:border-emerald-500 font-bold shadow-[0_0_15px_rgba(220,174,69,0.2)]" placeholder="Enter Bid" />
                                <div className="flex gap-2 mt-4">
                                    <button onClick={() => setBidInput(Math.floor(playerTokens/2))} className="flex-1 bg-[#222] border border-[#dcae45]/50 py-2 rounded-lg font-bold">1/2</button>
                                    <button onClick={() => setBidInput(playerTokens)} className="flex-1 bg-[#222] border border-[#dcae45]/50 py-2 rounded-lg font-bold">Max</button>
                                </div>
                                <button onClick={() => handleBidSubmit(false)} className="w-full mt-8 btn-gold-glow py-4 rounded-xl text-lg uppercase tracking-widest">Lock Bid</button>
                            </div>
                        ) : (
                            <div className="mt-8 text-center animate-pulse">
                                <h3 className="text-xl font-bold mb-4">Round Result</h3>
                                <div className="flex justify-between text-2xl font-black mb-4">
                                    <span className="text-emerald-400">{roundResult.pBid}</span>
                                    <span className="text-gray-500">vs</span>
                                    <span className="text-rose-400">{roundResult.bBid}</span>
                                </div>
                                <div className="text-lg text-[#ffe29a]">{roundResult.winner === 'DRAW' ? 'Tied!' : `${roundResult.winner} WON`}</div>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto bg-black min-h-screen relative pb-28 shadow-2xl">
                    
                    {/* Header: Logo size increased (h-16) */}
                    <div className="flex justify-between items-center px-4 pt-6 pb-2 border-b border-[#dcae45]/20">
                        <img src="youth-earners-logo.png" style={{mixBlendMode:'screen'}} className="h-16 w-auto object-contain" alt="Logo" />
                        <div onClick={()=>setActiveTab('wallet')} className="bg-[#111] cursor-pointer border border-[#dcae45] px-4 py-1.5 rounded-full text-sm font-bold text-[#ffe29a] flex items-center gap-2 shadow-[0_0_10px_rgba(220,174,69,0.3)]">
                            <i className="fa-solid fa-wallet"></i> ₹{wallet.toFixed(2)}
                        </div>
                    </div>

                    <div className="p-4">
                        {/* ---------------- HOME TAB ---------------- */}
                        {activeTab === 'home' && (
                            <div className="space-y-6">
                                {/* Banner */}
                                <div className="w-full h-32 rounded-xl bg-gradient-to-r from-[#dcae45] to-[#8b6510] p-5 flex items-center justify-between shadow-[0_4px_15px_rgba(220,174,69,0.3)]">
                                    <div className="text-black">
                                        <h3 className="font-black text-2xl mb-1">Youth Earner's</h3>
                                        <p className="text-sm font-bold opacity-90">Play & Win Real Cash!</p>
                                    </div>
                                    <i className="fa-solid fa-trophy text-5xl text-black/20"></i>
                                </div>

                                {/* Practice VS Bot */}
                                <div className="bg-dark-premium p-4 rounded-xl flex items-center justify-between">
                                    <div>
                                        <h4 className="font-bold text-[#ffe29a]">Practice vs Bot</h4>
                                        <p className="text-xs text-gray-400">Free to play, train your skills</p>
                                    </div>
                                    <button onClick={() => { setCurrentBet(0); resetGameState(); setIsPlaying(true); }} className="btn-green-glow px-6 py-2 rounded-lg font-bold text-sm shadow-[0_0_10px_rgba(16,185,129,0.5)]">Play</button>
                                </div>

                                {/* Real Player Games (Vertical layout, Horizontal Cards) */}
                                <div>
                                    <h3 className="font-bold mb-4 text-[#ffe29a] flex items-center gap-2"><i className="fa-solid fa-users"></i> Play with Real Players</h3>
                                    <div className="flex flex-col gap-3">
                                        {playTiers.map(tier => (
                                            <div key={tier.entry} className="flex items-center justify-between bg-dark-premium rounded-xl p-3">
                                                <div className="flex items-center gap-4">
                                                    <div className="w-12 h-12 rounded-full bg-[#dcae45]/10 border border-[#dcae45]/30 flex items-center justify-center text-[#dcae45]">
                                                        <i className="fa-solid fa-coins text-xl"></i>
                                                    </div>
                                                    <div>
                                                        <div className="text-xs text-gray-400 mb-0.5">Entry: <span className="font-bold text-white text-sm">₹{tier.entry}</span></div>
                                                        <div className="text-xs text-emerald-400 font-bold">WIN: ₹{tier.win}</div>
                                                    </div>
                                                </div>
                                                <button 
                                                    onClick={() => startMatchmaking(tier.entry)} 
                                                    disabled={matchingTier === tier.entry}
                                                    className={`px-5 py-2 rounded-lg font-bold text-sm ${matchingTier === tier.entry ? 'bg-gray-700 text-gray-400 matching-text' : 'btn-green-glow shadow-[0_0_10px_rgba(16,185,129,0.3)]'}`}
                                                >
                                                    {matchingTier === tier.entry ? 'Wait...' : 'Play Now'}
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ---------------- WALLET TAB ---------------- */}
                        {activeTab === 'wallet' && (
                            <div className="space-y-6 pt-2">
                                <h2 className="text-2xl font-bold text-[#dcae45] text-center"><i className="fa-solid fa-vault"></i> My Wallet</h2>
                                <div className="bg-dark-premium p-6 rounded-xl text-center">
                                    <div className="text-gray-400 text-sm">Total Balance</div>
                                    <div className="text-5xl font-bold text-white my-3 tracking-wide">₹{wallet.toFixed(2)}</div>
                                    <div className="flex gap-4 mt-8">
                                        <button onClick={handleDeposit} className="flex-1 btn-green-glow py-3 rounded-xl font-bold text-lg"><i className="fa-solid fa-arrow-down"></i> Deposit</button>
                                        <button onClick={handleWithdraw} className="flex-1 bg-[#111] border border-gray-600 hover:border-[#dcae45] transition-colors py-3 rounded-xl font-bold text-lg text-white"><i className="fa-solid fa-arrow-up"></i> Withdraw</button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <button className="bg-dark-premium py-4 rounded-xl text-sm font-bold text-gray-300 hover:text-[#dcae45]"><i className="fa-solid fa-clock-rotate-left mb-2 text-xl block"></i> Deposit History</button>
                                    <button className="bg-dark-premium py-4 rounded-xl text-sm font-bold text-gray-300 hover:text-[#dcae45]"><i className="fa-solid fa-file-invoice-dollar mb-2 text-xl block"></i> Withdraw History</button>
                                </div>
                            </div>
                        )}

                        {/* ---------------- PROFILE TAB ---------------- */}
                        {activeTab === 'profile' && (
                            <div className="space-y-6 text-center pt-8">
                                <div className="relative inline-block">
                                    <img src={userProfile.avatar} alt="Profile" className="w-28 h-28 rounded-full object-cover border-4 border-[#dcae45] p-1 mx-auto bg-black" />
                                    <button onClick={() => fileInputRef.current.click()} className="absolute bottom-1 right-1 bg-[#dcae45] text-black w-8 h-8 flex items-center justify-center rounded-full border-2 border-black shadow-lg"><i className="fa-solid fa-pen"></i></button>
                                    <input type="file" ref={fileInputRef} onChange={handleImageUpload} accept="image/*" className="hidden" />
                                </div>
                                
                                <div>
                                    <input 
                                        type="text" 
                                        value={userProfile.name} 
                                        onChange={(e) => setUserProfile({...userProfile, name: e.target.value})}
                                        className="bg-transparent text-white text-3xl font-bold text-center border-b border-gray-800 focus:border-[#dcae45] focus:outline-none pb-2 w-64"
                                    />
                                    <p className="text-[#dcae45] mt-2 tracking-widest font-bold"><i className="fa-solid fa-phone text-xs"></i> +91 {userProfile.number}</p>
                                </div>

                                <div className="bg-dark-premium rounded-xl p-2 text-left mt-8">
                                    <div className="border-b border-gray-800 p-4 text-gray-300 flex justify-between items-center cursor-pointer hover:bg-white/5 rounded-t-lg"><span className="font-bold"><i className="fa-solid fa-shield-halved w-6 text-center text-[#dcae45]"></i> Security</span> <i className="fa-solid fa-chevron-right text-xs"></i></div>
                                    <div className="border-b border-gray-800 p-4 text-gray-300 flex justify-between items-center cursor-pointer hover:bg-white/5"><span className="font-bold"><i className="fa-solid fa-circle-info w-6 text-center text-[#dcae45]"></i> Rules</span> <i className="fa-solid fa-chevron-right text-xs"></i></div>
                                    <div className="p-4 text-red-500 font-bold flex justify-between items-center cursor-pointer hover:bg-white/5 rounded-b-lg"><span><i className="fa-solid fa-right-from-bracket w-6 text-center"></i> Logout</span></div>
                                </div>
                            </div>
                        )}

                        {/* ---------------- ABOUT TAB ---------------- */}
                        {activeTab === 'about' && (
                            <div className="bg-dark-premium p-6 rounded-xl mt-4">
                                <h2 className="text-2xl font-bold text-[#ffe29a] mb-4 text-center">About Youth Earner's</h2>
                                <img src="youth-earners-logo.png" className="w-32 mx-auto mb-6" style={{mixBlendMode:'screen'}} alt="logo" />
                                <p className="text-gray-300 text-sm leading-relaxed mb-4 text-justify">
                                    Welcome to <span className="text-[#dcae45] font-bold">Youth Earner's</span>, India's most premium and secure skill-based gaming platform. We believe in empowering the youth by providing a safe environment to test your strategies and win real rewards.
                                </p>
                                <div className="bg-[#111] border border-[#dcae45]/30 p-4 rounded-lg text-center mt-6">
                                    <div className="text-[#10b981] font-bold text-lg mb-1"><i className="fa-solid fa-shield-check"></i> 100% Secure</div>
                                    <div className="text-gray-400 text-xs">Instant Withdrawals & 24/7 Support.</div>
                                </div>
                            </div>
                        )}

                        {/* ---------------- SUPPORT TAB (Horizontal) ---------------- */}
                        {activeTab === 'support' && (
                            <div className="text-center pt-8">
                                <h2 className="text-3xl font-bold text-[#ffe29a] mb-2"><i className="fa-solid fa-headset"></i> Need Help?</h2>
                                <p className="text-gray-400 mb-10 text-sm">Our premium support team is available 24/7</p>
                                
                                <div className="flex gap-4 justify-center px-2">
                                    <button className="flex-1 bg-[#25D366] text-white py-4 rounded-xl font-bold flex flex-col justify-center items-center gap-2 shadow-[0_0_15px_rgba(37,211,102,0.3)] hover:scale-105 transition-transform">
                                        <i className="fa-brands fa-whatsapp text-3xl"></i>
                                        <span>WhatsApp</span>
                                    </button>
                                    <button className="flex-1 bg-gradient-to-tr from-[#f09433] via-[#e6683c] to-[#bc1888] text-white py-4 rounded-xl font-bold flex flex-col justify-center items-center gap-2 shadow-[0_0_15px_rgba(188,24,136,0.3)] hover:scale-105 transition-transform">
                                        <i className="fa-brands fa-instagram text-3xl"></i>
                                        <span>Instagram</span>
                                    </button>
                                </div>
                                
                                <p className="text-gray-500 text-xs mt-10">Email: support@youthearners.com</p>
                            </div>
                        )}
                    </div>

                    {/* BOTTOM NAVIGATION BAR WITH ELEVATED WALLET */}
                    <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#050505] border-t border-[#dcae45]/30 flex justify-between items-end pb-3 pt-3 px-6 z-50 rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.9)]">
                        <button onClick={()=>setActiveTab('home')} className={`flex flex-col items-center gap-1.5 w-12 ${activeTab==='home'?'text-[#dcae45]':'text-gray-600 hover:text-gray-400'}`}>
                            <i className={`fa-solid fa-house text-xl ${activeTab==='home'?'drop-shadow-[0_0_8px_rgba(220,174,69,0.8)]':''}`}></i>
                            <span className="text-[10px] font-bold">Home</span>
                        </button>
                        
                        <button onClick={()=>setActiveTab('about')} className={`flex flex-col items-center gap-1.5 w-12 ${activeTab==='about'?'text-[#dcae45]':'text-gray-600 hover:text-gray-400'}`}>
                            <i className={`fa-solid fa-circle-info text-xl ${activeTab==='about'?'drop-shadow-[0_0_8px_rgba(220,174,69,0.8)]':''}`}></i>
                            <span className="text-[10px] font-bold">About</span>
                        </button>
                        
                        {/* Elevated Wallet Button in Center */}
                        <div className="relative -top-7">
                            <button onClick={()=>setActiveTab('wallet')} className={`w-16 h-16 rounded-full flex items-center justify-center border-4 border-[#050505] shadow-[0_0_20px_rgba(220,174,69,0.4)] transition-all ${activeTab==='wallet'?'bg-gradient-to-b from-[#ffe29a] to-[#dcae45] text-black scale-110':'bg-[#111] text-[#dcae45]'}`}>
                                <i className="fa-solid fa-wallet text-2xl"></i>
                            </button>
                        </div>
                        
                        <button onClick={()=>setActiveTab('support')} className={`flex flex-col items-center gap-1.5 w-12 ${activeTab==='support'?'text-[#dcae45]':'text-gray-600 hover:text-gray-400'}`}>
                            <i className={`fa-solid fa-headset text-xl ${activeTab==='support'?'drop-shadow-[0_0_8px_rgba(220,174,69,0.8)]':''}`}></i>
                            <span className="text-[10px] font-bold">Support</span>
                        </button>
                        
                        <button onClick={()=>setActiveTab('profile')} className={`flex flex-col items-center gap-1.5 w-12 ${activeTab==='profile'?'text-[#dcae45]':'text-gray-600 hover:text-gray-400'}`}>
                            <i className={`fa-solid fa-user text-xl ${activeTab==='profile'?'drop-shadow-[0_0_8px_rgba(220,174,69,0.8)]':''}`}></i>
                            <span className="text-[10px] font-bold">Profile</span>
                        </button>
                    </div>

                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
