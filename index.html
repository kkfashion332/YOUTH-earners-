<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Youth Earner's - Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="intro-running bg-premium-dark text-white">

    <!-- ORIGINAL RESTORED INTRO -->
    <div id="logoIntro">
        <div class="intro-stage">
            <img class="intro-logo" src="youth-earners-logo.png" alt="Youth Earner's" />
            <div class="intro-line"></div>
            <p class="intro-title">Youth Earner's</p>
        </div>
    </div>

    <div id="authContainer" class="hidden auth-wrapper">
        <div class="form-container">
            <img class="intro-logo mx-auto mb-6" src="youth-earners-logo.png" alt="Logo" />
            <form id="loginForm" class="auth-form flex flex-col gap-4">
                <h2 class="text-2xl font-black text-center text-[#dcae45] mb-2 uppercase tracking-widest">Welcome Back</h2>
                <input type="tel" id="loginNumber" placeholder="Mobile Number" pattern="[0-9]{10}" maxlength="10" required class="w-full bg-black border border-gray-700 p-4 rounded-xl text-white focus:border-[#dcae45] outline-none">
                <input type="password" id="loginPassword" placeholder="Password (Min 6 digits)" minlength="6" required class="w-full bg-black border border-gray-700 p-4 rounded-xl text-white focus:border-[#dcae45] outline-none">
                <button type="submit" id="loginBtn" class="w-full btn-play-gold py-4 rounded-xl text-lg tracking-widest mt-2 uppercase">Log In</button>
                <p class="text-center text-sm text-gray-400 mt-2">New user? <span id="showRegister" class="text-[#dcae45] font-bold cursor-pointer hover:underline">Register</span></p>
            </form>

            <form id="registerForm" class="auth-form hidden flex flex-col gap-4">
                <h2 class="text-2xl font-black text-center text-[#dcae45] mb-2 uppercase tracking-widest">Create Account</h2>
                <input type="text" id="regName" placeholder="Full Name" required class="w-full bg-black border border-gray-700 p-3 rounded-xl text-white focus:border-[#dcae45] outline-none">
                <input type="tel" id="regNumber" placeholder="Mobile Number" pattern="[0-9]{10}" maxlength="10" required class="w-full bg-black border border-gray-700 p-3 rounded-xl text-white focus:border-[#dcae45] outline-none">
                <input type="password" id="regPassword" placeholder="Password (Min 6 digits)" minlength="6" required class="w-full bg-black border border-gray-700 p-3 rounded-xl text-white focus:border-[#dcae45] outline-none">
                <input type="text" id="regReferral" placeholder="Referral Code (Optional)" class="w-full bg-black border border-gray-700 p-3 rounded-xl text-white focus:border-[#dcae45] outline-none">
                <button type="submit" id="regBtn" class="w-full btn-play-gold py-4 rounded-xl text-lg tracking-widest mt-2 uppercase">Register</button>
                <p class="text-center text-sm text-gray-400 mt-2">Already have an account? <span id="showLogin" class="text-[#dcae45] font-bold cursor-pointer hover:underline">Log In</span></p>
            </form>
        </div>
    </div>

    <main id="website" class="hidden"><div id="root"></div></main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, updateDoc, addDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA4pTWtUMbZFhrMORZibUhV7gpPRy6DreY",
            authDomain: "youth-earners-d34ca.firebaseapp.com",
            projectId: "youth-earners-d34ca",
            storageBucket: "youth-earners-d34ca.firebasestorage.app",
            messagingSenderId: "568087034965",
            appId: "1:568087034965:web:b4f79488d22db53af128dc"
        };

        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
        window.fs = { collection, query, where, getDocs, doc, getDoc, updateDoc, addDoc, deleteDoc, onSnapshot, setDoc };

        window.addEventListener('load', () => {
            setTimeout(() => {
                const intro = document.getElementById('logoIntro');
                if(intro) { intro.style.opacity = '0'; setTimeout(() => intro.style.display = 'none', 500); }
            }, 2000);
        });

        onAuthStateChanged(window.auth, async (user) => {
            if (user) {
                document.getElementById('authContainer').classList.add('hidden');
                document.getElementById('website').classList.remove('hidden');
                try {
                    const docSnap = await getDoc(doc(window.db, "users", user.uid));
                    if (docSnap.exists()) window.dispatchEvent(new CustomEvent('gameStart', { detail: docSnap.data() }));
                } catch(e) {}
            } else {
                document.getElementById('authContainer').classList.remove('hidden');
                document.getElementById('website').classList.add('hidden');
            }
        });

        document.getElementById('showRegister').addEventListener('click', () => { document.getElementById('loginForm').classList.add('hidden'); document.getElementById('registerForm').classList.remove('hidden'); });
        document.getElementById('showLogin').addEventListener('click', () => { document.getElementById('registerForm').classList.add('hidden'); document.getElementById('loginForm').classList.remove('hidden'); });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const num = document.getElementById('loginNumber').value;
            const pwd = document.getElementById('loginPassword').value;
            try { await signInWithEmailAndPassword(window.auth, `${num}@ye.com`, pwd); } 
            catch(err) { alert("Invalid Number or Password!"); }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const num = document.getElementById('regNumber').value;
            const pwd = document.getElementById('regPassword').value;
            const ref = document.getElementById('regReferral').value;
            try {
                const userCredential = await createUserWithEmailAndPassword(window.auth, `${num}@ye.com`, pwd);
                await setDoc(doc(window.db, "users", userCredential.user.uid), {
                    name, number: num, wallet: 0, withdrawable: 0, referralUsed: ref, avatar: 'youth-earners-logo.png', joined: new Date()
                });
                alert("Registration Successful!");
            } catch (error) { alert("Error: This Number is already registered!"); }
        });
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('home'); 
            const [isPlaying, setIsPlaying] = useState(false); 
            
            const savedAvatar = localStorage.getItem('userAvatar') || 'youth-earners-logo.png';
            const savedName = localStorage.getItem('userName') || 'Player';
            
            const [userProfile, setUserProfile] = useState({ name: savedName, number: '9999999999', avatar: savedAvatar });
            const [wallet, setWallet] = useState(0);
            const [withdrawable, setWithdrawable] = useState(0);
            
            const [confirmPopup, setConfirmPopup] = useState(null); 
            const [showWinPopup, setShowWinPopup] = useState(null);
            
            const [preMatchDeduction, setPreMatchDeduction] = useState(null); // Fix 5: Wallet Deduction UI
            const [isMatchmaking, setIsMatchmaking] = useState(false);
            const [matchTime, setMatchTime] = useState(20);
            const [matchFound, setMatchFound] = useState(false);
            const [opponent, setOpponent] = useState({ name: 'Searching...', img: 'youth-earners-logo.png' });
            
            const [roomId, setRoomId] = useState(null);
            const [playerRole, setPlayerRole] = useState(null); 
            const [roomData, setRoomData] = useState(null);
            const [bidInput, setBidInput] = useState(0);
            
            // Fix 3 & 7: Round Timer & Chat Logic
            const [roundTimer, setRoundTimer] = useState(10);
            const [p1Chat, setP1Chat] = useState(null);
            const [p2Chat, setP2Chat] = useState(null);

            const [playTiers, setPlayTiers] = useState([{ entry: 5, win: 9 }, { entry: 10, win: 18 }]);
            
            // Audio Contexts
            let audioCtx = useRef(null);

            // Play fast slider tick
            const playSliderTick = () => {
                try {
                    if (!audioCtx.current) audioCtx.current = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.current.state === 'suspended') audioCtx.current.resume();
                    const osc = audioCtx.current.createOscillator();
                    const gain = audioCtx.current.createGain();
                    osc.connect(gain); gain.connect(audioCtx.current.destination);
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(800, audioCtx.current.currentTime); 
                    gain.gain.setValueAtTime(0.05, audioCtx.current.currentTime);
                    osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.current.currentTime + 0.03);
                    osc.stop(audioCtx.current.currentTime + 0.03);
                } catch(e){}
            };

            // Play loud tick for last 3 seconds
            const playLoudTick = () => {
                try {
                    if (!audioCtx.current) audioCtx.current = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.current.state === 'suspended') audioCtx.current.resume();
                    const osc = audioCtx.current.createOscillator();
                    const gain = audioCtx.current.createGain();
                    osc.connect(gain); gain.connect(audioCtx.current.destination);
                    osc.type = 'square'; osc.frequency.setValueAtTime(400, audioCtx.current.currentTime); 
                    gain.gain.setValueAtTime(0.2, audioCtx.current.currentTime);
                    osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.current.currentTime + 0.1);
                    osc.stop(audioCtx.current.currentTime + 0.1);
                } catch(e){}
            };

            useEffect(() => {
                let unsubWallet = null;
                const handleGameStart = (e) => {
                    const data = e.detail;
                    if(data) {
                        setUserProfile(prev => ({ ...prev, name: data.name || prev.name, avatar: data.avatar || prev.avatar }));
                        if(data.wallet !== undefined) setWallet(data.wallet);
                        if(data.withdrawable !== undefined) setWithdrawable(data.withdrawable);
                        
                        if(window.auth && window.auth.currentUser) {
                            unsubWallet = window.fs.onSnapshot(window.fs.doc(window.db, "users", window.auth.currentUser.uid), (docSnap) => {
                                if(docSnap.exists()){
                                    setWallet(docSnap.data().wallet || 0);
                                    setWithdrawable(docSnap.data().withdrawable || 0);
                                }
                            });
                        }
                    }
                };
                window.addEventListener('gameStart', handleGameStart);
                return () => { window.removeEventListener('gameStart', handleGameStart); if(unsubWallet) unsubWallet(); };
            }, []);

            useEffect(() => {
                let unsubMatches = null;
                const fetchLiveSettingsAndMatches = async () => {
                    if(window.fs && window.db) {
                        unsubMatches = window.fs.onSnapshot(window.fs.collection(window.db, "match_tiers"), (snap) => {
                            let m = []; snap.forEach(doc => m.push({ id: doc.id, ...doc.data() }));
                            if(m.length > 0) { m.sort((a,b) => a.entry - b.entry); setPlayTiers(m); }
                        });
                    } else { setTimeout(fetchLiveSettingsAndMatches, 500); }
                };
                fetchLiveSettingsAndMatches();
                return () => { if(unsubMatches) unsubMatches(); };
            }, []);

            // Fix 5: Pre-Match Wallet Deduction Logic
            const confirmPlay = async () => {
                if (wallet < confirmPopup.entry) { alert("Low Balance! Please deposit money to play."); setConfirmPopup(null); return; }
                const tier = confirmPopup; setConfirmPopup(null);
                
                // Show Deduction UI first
                setPreMatchDeduction(tier.entry);
                
                setTimeout(() => {
                    setPreMatchDeduction(null);
                    startMatchmakingFirebase(tier);
                }, 1500);
            };

            const startMatchmakingFirebase = async (tier) => {
                setMatchFound(false); setMatchTime(20); setIsMatchmaking(true); 
                try {
                    const q = window.fs.query(window.fs.collection(window.db, "rooms"), window.fs.where("tier", "==", tier.entry), window.fs.where("status", "==", "waiting"));
                    const querySnapshot = await window.fs.getDocs(q);

                    if (!querySnapshot.empty) {
                        const roomDoc = querySnapshot.docs[0];
                        await window.fs.updateDoc(window.fs.doc(window.db, "rooms", roomDoc.id), { status: 'playing', p2: { uid: window.auth.currentUser.uid, name: userProfile.name, img: userProfile.avatar } });
                        setRoomId(roomDoc.id); setPlayerRole(2);
                    } else {
                        const docRef = await window.fs.addDoc(window.fs.collection(window.db, "rooms"), {
                            tier: tier.entry, status: 'waiting', p1: { uid: window.auth.currentUser.uid, name: userProfile.name, img: userProfile.avatar },
                            p1Bid: null, p2Bid: null, round: 1, p1Tokens: 500, p2Tokens: 500, p1Wins: 0, p2Wins: 0, lastResult: null, exited: null, chat: null, createdAt: new Date()
                        });
                        setRoomId(docRef.id); setPlayerRole(1);
                    }
                } catch(e) { alert("Error connecting to server!"); setIsMatchmaking(false); }
            };

            const cancelMatchmaking = async () => {
                setIsMatchmaking(false);
                if(playerRole === 1 && roomId) { await window.fs.deleteDoc(window.fs.doc(window.db, "rooms", roomId)); }
                setRoomId(null);
            };

            // Fix 7: Individual 10 Second Timer Logic per Round
            useEffect(() => {
                let timerInterval;
                if (isPlaying && roomData && !roomData.lastResult) {
                    timerInterval = setInterval(() => {
                        setRoundTimer(prev => {
                            if (prev <= 1) {
                                clearInterval(timerInterval);
                                // Auto Submit Bid if time is up
                                let myBidStatus = playerRole === 1 ? roomData.p1Bid : roomData.p2Bid;
                                if (myBidStatus === null) forceSubmitBid();
                                return 0;
                            }
                            if (prev <= 4) playLoudTick(); // Play sound on 3, 2, 1
                            return prev - 1;
                        });
                    }, 1000);
                } else {
                    setRoundTimer(10); // Reset timer when result shows
                }
                return () => clearInterval(timerInterval);
            }, [isPlaying, roomData?.round, roomData?.lastResult]);

            useEffect(() => {
                if (!roomId) return;
                const unsub = window.fs.onSnapshot(window.fs.doc(window.db, "rooms", roomId), async (doc) => {
                    const data = doc.data(); if(!data) return; setRoomData(data);

                    // EMOJI CHAT LISTENER
                    if (data.chat && data.chat.timestamp) {
                        if (data.chat.sender === 1) {
                            setP1Chat(data.chat.text); setTimeout(() => setP1Chat(null), 3000);
                        } else {
                            setP2Chat(data.chat.text); setTimeout(() => setP2Chat(null), 3000);
                        }
                    }

                    if(data.status === 'playing' && !matchFound) {
                        setMatchFound(true); setOpponent(playerRole === 1 ? data.p2 : data.p1);
                        setTimeout(() => { 
                            if (data.tier > 0 && window.auth.currentUser) {
                                const userRef = window.fs.doc(window.db, "users", window.auth.currentUser.uid);
                                window.fs.getDoc(userRef).then(uSnap => {
                                    if(uSnap.exists()){ let dbW = uSnap.data().wallet || 0; window.fs.updateDoc(userRef, { wallet: dbW - data.tier }); }
                                });
                            }
                            setIsMatchmaking(false); setIsPlaying(true); setBidInput(0); setRoundTimer(10);
                        }, 3000);
                    }

                    if(data.status === 'finished') {
                        setIsPlaying(false); setRoomId(null);
                        let isWinner = false;
                        
                        // Fix 6: Check if someone exited
                        if (data.exited) {
                            if (data.exited === playerRole) { isWinner = false; alert("You left the match. You Lose."); }
                            else { isWinner = true; alert("Opponent left the match. YOU WIN!"); }
                        } else {
                            if(data.p1Wins > data.p2Wins || (data.p1Wins === data.p2Wins && data.p1Tokens > data.p2Tokens)) { isWinner = playerRole === 1; } 
                            else if(data.p2Wins > data.p1Wins || (data.p2Wins === data.p1Wins && data.p2Tokens > data.p1Tokens)) { isWinner = playerRole === 2; } 
                            else { isWinner = 'draw'; }
                        }
                        
                        if(isWinner === true) {
                            let winnings = data.tier * 1.8;
                            if(window.auth.currentUser) { 
                                const userRef = window.fs.doc(window.db, "users", window.auth.currentUser.uid);
                                window.fs.getDoc(userRef).then(uSnap => {
                                    if(uSnap.exists()){
                                        let dbW = uSnap.data().wallet || 0; let dbWith = uSnap.data().withdrawable || 0;
                                        window.fs.updateDoc(userRef, { wallet: dbW + winnings, withdrawable: dbWith + winnings });
                                    }
                                });
                            }
                            setShowWinPopup(winnings); 
                        } else if(isWinner === 'draw') {
                            if(window.auth.currentUser) {
                                const userRef = window.fs.doc(window.db, "users", window.auth.currentUser.uid);
                                window.fs.getDoc(userRef).then(uSnap => {
                                    if(uSnap.exists()){ let dbW = uSnap.data().wallet || 0; window.fs.updateDoc(userRef, { wallet: dbW + data.tier }); }
                                });
                            }
                            alert("Match Draw! Entry fee refunded.");
                        }
                    }

                    // Proceed Round Logic
                    if(data.status === 'playing' && data.p1Bid !== null && data.p2Bid !== null && !data.lastResult) {
                        if(playerRole === 1) {
                            let p1T = data.p1Tokens - data.p1Bid; let p2T = data.p2Tokens - data.p2Bid;
                            let p1W = data.p1Wins; let p2W = data.p2Wins; let winner = "DRAW";
                            if(data.p1Bid > data.p2Bid) { winner = data.p1.name; p1W++; }
                            else if(data.p2Bid > data.p1Bid) { winner = data.p2.name; p2W++; }
                            
                            let nextRound = data.round + 1;
                            await window.fs.updateDoc(window.fs.doc(window.db, "rooms", roomId), {
                                p1Tokens: p1T, p2Tokens: p2T, p1Wins: p1W, p2Wins: p2W, lastResult: { p1Bid: data.p1Bid, p2Bid: data.p2Bid, winner }
                            });
                            setTimeout(async () => {
                                if(nextRound > 3) { await window.fs.updateDoc(window.fs.doc(window.db, "rooms", roomId), { status: 'finished' }); } 
                                else { await window.fs.updateDoc(window.fs.doc(window.db, "rooms", roomId), { p1Bid: null, p2Bid: null, round: nextRound, lastResult: null }); }
                            }, 3500);
                        }
                    }
                });
                return () => unsub();
            }, [roomId, matchFound, playerRole]);

            useEffect(() => {
                let timer;
                if (isMatchmaking && !matchFound) {
                    timer = setInterval(() => {
                        setMatchTime(prev => {
                            if(prev <= 1) {
                                clearInterval(timer); setIsMatchmaking(false); alert("No real player found. Try again!");
                                if(playerRole === 1 && roomId) { window.fs.deleteDoc(window.fs.doc(window.db, "rooms", roomId)); }
                                setRoomId(null); return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [isMatchmaking, matchFound, roomId, playerRole]);

            // Force submit when timer ends
            const forceSubmitBid = async () => {
                if(!roomId || !roomData) return;
                let myTokens = playerRole === 1 ? roomData.p1Tokens : roomData.p2Tokens;
                let b = parseInt(bidInput) || 0;
                if(b > myTokens) b = myTokens;
                await window.fs.updateDoc(window.fs.doc(window.db, "rooms", roomId), { [playerRole === 1 ? 'p1Bid' : 'p2Bid']: b });
            };

            const submitUserBid = async () => {
                if(!roomId || !roomData) return;
                let myTokens = playerRole === 1 ? roomData.p1Tokens : roomData.p2Tokens;
                let b = parseInt(bidInput) || 0;
                if(b > myTokens) b = myTokens;
                await window.fs.updateDoc(window.fs.doc(window.db, "rooms", roomId), { [playerRole === 1 ? 'p1Bid' : 'p2Bid']: b });
            };

            const handleSliderChange = (e) => {
                setBidInput(e.target.value);
                playSliderTick();
            };

            // Fix 6: Game Exit Logic
            const handleExitGame = async () => {
                if(confirm("WARNING: Are you sure you want to exit? You will lose this match and your entry fee!")) {
                    await window.fs.updateDoc(window.fs.doc(window.db, "rooms", roomId), { 
                        status: 'finished', exited: playerRole 
                    });
                }
            };

            // Fix 3: Send Chat Emoji
            const sendChat = async (emoji) => {
                if(!roomId) return;
                await window.fs.updateDoc(window.fs.doc(window.db, "rooms", roomId), {
                    chat: { sender: playerRole, text: emoji, timestamp: Date.now() }
                });
            };

            // ==================== RENDERS ==================== //

            if (preMatchDeduction !== null) {
                return (
                    <div className="fixed inset-0 z-[120] bg-black flex flex-col items-center justify-center p-4">
                        <i className="fa-solid fa-wallet text-[#dcae45] text-6xl mb-4 animate-bounce"></i>
                        <h2 className="text-2xl font-black text-white uppercase tracking-widest text-center">Processing Entry Fee...</h2>
                        <p className="text-red-500 font-bold text-3xl mt-4">-₹{preMatchDeduction}</p>
                        <p className="text-gray-400 text-sm mt-2 font-bold">Deducted from your wallet</p>
                    </div>
                );
            }

            if (isMatchmaking) {
                return (
                    <div className="fixed inset-0 z-[100] bg-[#050505] text-white flex flex-col items-center pt-20 px-6">
                        <div className="absolute top-10 w-full text-center">
                            <h2 className="text-[#ffe29a] text-xl font-bold tracking-widest uppercase">{matchFound ? "MATCH FOUND!" : "SEARCHING..."}</h2>
                            {!matchFound && <p className="text-gray-400 text-sm mt-2">Timeout in: {matchTime}s</p>}
                        </div>
                        <div className="flex w-full justify-between items-center mt-24">
                            <div className="flex flex-col items-center">
                                <div className="w-24 h-24 rounded-full border-4 border-[#3b82f6] p-1 shadow-[0_0_20px_rgba(59,130,246,0.5)] bg-black">
                                    <img src={userProfile.avatar} className="w-full h-full rounded-full object-cover" />
                                </div>
                                <span className="font-bold mt-4 text-lg">{userProfile.name}</span>
                            </div>
                            <div className="text-4xl font-black text-[#dcae45] italic tracking-tighter drop-shadow-[0_0_10px_rgba(220,174,69,0.8)]">VS</div>
                            <div className="flex flex-col items-center">
                                <div className={`w-24 h-24 rounded-full border-4 p-1 bg-black ${matchFound ? 'border-[#ef4444] shadow-[0_0_20px_rgba(239,68,68,0.5)]' : 'border-[#dcae45] border-dashed spin-slow'}`}>
                                    <img src={opponent.img} className={`w-full h-full rounded-full object-cover ${matchFound ? '' : 'animate-pulse opacity-50'}`} />
                                </div>
                                <span className="font-bold mt-4 text-lg">{opponent.name}</span>
                            </div>
                        </div>
                        {!matchFound && ( <button onClick={cancelMatchmaking} className="absolute bottom-20 px-8 py-3 rounded-full border-2 border-red-500 text-red-500 font-bold hover:bg-red-500 hover:text-white transition-colors"> Cancel Search </button> )}
                    </div>
                );
            }

            if (isPlaying && roomData) {
                let myData = playerRole === 1 ? roomData.p1 : roomData.p2;
                let oppData = playerRole === 1 ? roomData.p2 : roomData.p1;
                let myTokens = playerRole === 1 ? roomData.p1Tokens : roomData.p2Tokens;
                let oppTokens = playerRole === 1 ? roomData.p2Tokens : roomData.p1Tokens;
                let myBidStatus = playerRole === 1 ? roomData.p1Bid : roomData.p2Bid;
                let myChat = playerRole === 1 ? p1Chat : p2Chat;
                let oppChat = playerRole === 1 ? p2Chat : p1Chat;

                return (
                    <div className="max-w-md mx-auto bg-transparent min-h-screen text-white p-4 flex flex-col relative pb-28">
                        
                        {/* Header & Exit */}
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-xl font-bold text-[#dcae45]"><i className="fa-solid fa-gamepad"></i> Game Running</h2>
                            <button onClick={handleExitGame} className="bg-red-600/20 text-red-500 border border-red-500 px-3 py-1 rounded-lg font-bold text-sm hover:bg-red-600 hover:text-white transition">Exit Game</button>
                        </div>
                        
                        {/* Players UI (Opposite Corners) & 10s Timer overlay */}
                        <div className="flex justify-between items-center gold-card p-4 rounded-xl mb-4">
                            {/* ME (Left) */}
                            <div className="text-center w-1/3 relative">
                                {myChat && <div className="chat-bubble left-0">{myChat}</div>}
                                <div className="relative w-14 h-14 mx-auto mb-1">
                                    <img src={myData.img} className="w-full h-full rounded-full object-cover border-2 border-[#3b82f6]"/>
                                    {!roomData.lastResult && myBidStatus === null && (
                                        <div className={`timer-overlay ${roundTimer <= 5 ? 'timer-red' : ''}`}>{roundTimer}</div>
                                    )}
                                </div>
                                <div className="text-[10px] text-gray-400 font-bold uppercase">You</div>
                                <div className="text-2xl font-bold text-[#ffe29a]">{myTokens}</div>
                            </div>
                            
                            <div className="text-xl font-black text-[#dcae45] w-1/3 text-center">R{roomData.round}/3</div>
                            
                            {/* OPPONENT (Right) */}
                            <div className="text-center w-1/3 relative">
                                {oppChat && <div className="chat-bubble right right-0">{oppChat}</div>}
                                <div className="relative w-14 h-14 mx-auto mb-1">
                                    <img src={oppData.img} className="w-full h-full rounded-full object-cover border-2 border-[#ef4444]"/>
                                    {!roomData.lastResult && (playerRole === 1 ? roomData.p2Bid : roomData.p1Bid) === null && (
                                        <div className={`timer-overlay ${roundTimer <= 5 ? 'timer-red' : ''}`}>{roundTimer}</div>
                                    )}
                                </div>
                                <div className="text-[10px] text-gray-400 font-bold uppercase truncate px-1">{oppData.name}</div>
                                <div className="text-2xl font-bold text-rose-400">{oppTokens}</div>
                            </div>
                        </div>
                        
                        {!roomData.lastResult ? (
                            <div className="mt-4">
                                {myBidStatus === null ? (
                                    <div className="bg-[#111] border border-gray-800 p-6 rounded-2xl">
                                        <div className="flex justify-between text-gray-400 text-xs font-bold uppercase mb-2">
                                            <span>Your Bid</span>
                                            <span className="text-[#dcae45]">{bidInput}</span>
                                        </div>
                                        
                                        {/* Slider Range */}
                                        <input type="range" min="0" max={myTokens} value={bidInput} onChange={handleSliderChange} className="bid-slider w-full" />
                                        
                                        <div className="text-center text-[#ffe29a] text-5xl font-black my-4 drop-shadow-[0_0_10px_rgba(220,174,69,0.5)]">{bidInput}</div>
                                        
                                        <div className="flex gap-2 mt-4 mb-6">
                                            <button onClick={() => {setBidInput(Math.floor(myTokens/2)); playSliderTick();}} className="flex-1 bg-black border border-[#dcae45]/50 py-2 rounded-lg font-bold text-[#ffe29a]">Half (1/2)</button>
                                            <button onClick={() => {setBidInput(myTokens); playSliderTick();}} className="flex-1 bg-black border border-[#dcae45]/50 py-2 rounded-lg font-bold text-[#ffe29a]">Max All</button>
                                        </div>
                                        <button onClick={submitUserBid} className="w-full btn-play-gold py-4 rounded-full text-lg tracking-widest font-black uppercase">Lock Bid</button>
                                    </div>
                                ) : (
                                    <div className="text-center mt-16 animate-pulse text-[#dcae45] font-bold text-xl">Waiting for opponent to lock bid...</div>
                                )}
                            </div>
                        ) : (
                            <div className="mt-8 text-center pop-in">
                                <h3 className="text-xl font-bold mb-4">Round Result</h3>
                                <div className="flex justify-between text-2xl font-black mb-4 px-6">
                                    <span className="text-[#3b82f6]">{playerRole === 1 ? roomData.lastResult.p1Bid : roomData.lastResult.p2Bid}</span>
                                    <span className="text-gray-500">vs</span>
                                    <span className="text-[#ef4444]">{playerRole === 1 ? roomData.lastResult.p2Bid : roomData.lastResult.p1Bid}</span>
                                </div>
                                <div className="text-2xl text-[#ffe29a] font-bold mt-4 p-4 border border-[#dcae45] rounded-xl bg-[#111]">{roomData.lastResult.winner === 'DRAW' ? 'Round Tied!' : `${roomData.lastResult.winner} WON Round ${roomData.round}`}</div>
                            </div>
                        )}

                        {/* EMOJI CHAT BAR (Bottom) */}
                        <div className="absolute bottom-4 left-4 right-4 bg-[#111] border border-gray-800 rounded-xl p-3 flex justify-between items-center shadow-[0_0_15px_rgba(0,0,0,0.8)]">
                            <span className="text-xs text-gray-500 font-bold uppercase"><i className="fa-solid fa-comment-dots mr-1 text-[#dcae45]"></i> Send:</span>
                            <div className="flex gap-4">
                                <button onClick={()=>sendChat('😂')} className="text-2xl hover:scale-125 transition">😂</button>
                                <button onClick={()=>sendChat('😡')} className="text-2xl hover:scale-125 transition">😡</button>
                                <button onClick={()=>sendChat('😭')} className="text-2xl hover:scale-125 transition">😭</button>
                                <button onClick={()=>sendChat('🤩')} className="text-2xl hover:scale-125 transition">🤩</button>
                                <button onClick={()=>sendChat('🚀')} className="text-2xl hover:scale-125 transition">🚀</button>
                            </div>
                        </div>
                    </div>
                );
            }

            // (The rest of the standard UI: Home, Ranking, Wallet, Refer, Profile)
            return (
                <div className="max-w-md mx-auto bg-transparent min-h-screen relative pb-24">
                    <div className="mz-style-header">
                        <div className="mz-header-left"><img src="youth-earners-logo.png" alt="Logo" /></div>
                        <div className="mz-header-center">
                            <h1 className="mz-header-title">YOUTH EARNERS</h1>
                            <div className="mz-header-subtitle"><span className="line"></span><span className="text">PLAY • EARN • GROW</span><span className="line"></span></div>
                        </div>
                    </div>

                    <div className="p-4 pt-4">
                        {activeTab === 'home' && (
                            <div className="space-y-6 pop-in">
                                <div className="bg-gradient-to-r from-[#111] to-[#0a0a0a] border border-[#dcae45]/40 rounded-2xl p-5 shadow-[0_4px_15px_rgba(220,174,69,0.15)] relative overflow-hidden">
                                    <div className="absolute -right-10 -top-10 w-32 h-32 bg-[#dcae45] opacity-10 blur-3xl rounded-full"></div>
                                    <div className="flex justify-between items-center relative z-10">
                                        <div>
                                            <p className="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Total Balance</p>
                                            <h2 className="text-3xl font-black text-white">₹{wallet.toFixed(2)}</h2>
                                        </div>
                                        <div className="w-12 h-12 rounded-full bg-black border-2 border-[#dcae45] flex items-center justify-center shadow-[0_0_10px_rgba(220,174,69,0.3)]">
                                            <i className="fa-solid fa-wallet text-[#dcae45] text-xl"></i>
                                        </div>
                                    </div>
                                </div>

                                <div className="mt-8">
                                    <h3 className="font-bold mb-4 text-white text-lg flex items-center gap-2">
                                        <i className="fa-solid fa-users text-[#dcae45]"></i> Play for Real Cash
                                    </h3>
                                    <div className="grid grid-cols-2 gap-4">
                                        {playTiers.map((tier, index) => (
                                            <div key={tier.id || index} className="gold-card rounded-2xl p-4 flex flex-col items-center text-center relative overflow-hidden">
                                                <div className="bg-black border border-[#dcae45]/30 rounded-lg px-4 py-1.5 mb-3 shadow-[0_0_10px_rgba(0,0,0,0.8)]">
                                                    <img src={tier.logo || "youth-earners-logo.png"} style={{mixBlendMode:'screen'}} className="h-6 w-auto opacity-90" alt="game-icon" />
                                                </div>
                                                <div className="text-xs text-gray-400 mb-1">Entry: <span className="font-bold text-white text-base">₹{tier.entry}</span></div>
                                                <div className="text-[22px] text-[#ffe29a] font-black mb-5 drop-shadow-[0_0_10px_rgba(220,174,69,0.5)] tracking-wide">WIN: ₹{tier.win}</div>
                                                <button onClick={() => setConfirmPopup(tier)} className="w-full btn-play-gold py-2.5 rounded-full font-black text-[13px] tracking-wide flex items-center justify-center gap-2"><i className="fa-solid fa-play"></i> Play Now</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {/* CONFIRM MATCH MODAL */}
                        {confirmPopup && (
                            <div className="fixed inset-0 bg-black z-[80] flex flex-col items-center justify-center p-6 pop-in">
                                <div className="w-full max-w-sm flex flex-col gap-8">
                                    <div className="mx-auto w-24 h-24 bg-gradient-to-tr from-[#dcae45] to-[#ffe29a] rounded-full flex items-center justify-center text-black text-5xl shadow-[0_0_30px_rgba(220,174,69,0.6)]">
                                        <i className="fa-solid fa-coins"></i>
                                    </div>
                                    <h2 className="text-3xl font-black text-center text-white tracking-widest uppercase">Confirm Match</h2>
                                    <div className="bg-[#111] border border-[#dcae45] rounded-3xl p-8 flex flex-col gap-6 text-center shadow-[0_0_20px_rgba(220,174,69,0.2)]">
                                        <div><div className="text-gray-400 text-sm mb-1 uppercase tracking-wider">Entry Amount</div><div className="text-white font-black text-4xl">₹{confirmPopup.entry}</div></div>
                                        <hr className="border-gray-800" />
                                        <div><div className="text-gray-400 text-sm mb-1 uppercase tracking-wider">Winning Amount</div><div className="text-[#ffe29a] font-black text-5xl drop-shadow-[0_0_10px_rgba(220,174,69,0.8)]">₹{confirmPopup.win}</div></div>
                                    </div>
                                    <div className="flex gap-4 w-full mt-4">
                                        <button onClick={() => setConfirmPopup(null)} className="flex-1 bg-transparent border-2 border-gray-600 text-gray-300 py-4 rounded-2xl font-bold text-lg hover:bg-gray-800 transition">Cancel</button>
                                        <button onClick={confirmPlay} className="flex-1 btn-play-gold py-4 rounded-2xl font-black text-lg text-black uppercase tracking-wide">Play Now</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VICTORY POPUP */}
                        {showWinPopup !== null && (
                            <div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/90 backdrop-blur-md victory-anim px-4">
                                <div className="bg-gradient-to-b from-[#1a1508] to-[#000] border-2 border-[#dcae45] p-8 rounded-3xl text-center shadow-[0_0_50px_rgba(220,174,69,0.5)] w-full max-w-sm">
                                    <i className="fa-solid fa-trophy text-8xl text-[#dcae45] mb-6 drop-shadow-[0_0_20px_#ffe29a]"></i>
                                    <h2 className="text-4xl font-black text-white mb-2 tracking-widest uppercase">YOU WIN!</h2>
                                    <p className="text-gray-400 mb-6 font-bold">Amount added to Winning Wallet</p>
                                    <div className="text-6xl font-black text-[#10b981] drop-shadow-[0_0_15px_#10b981] mb-10">+₹{showWinPopup}</div>
                                    <button onClick={() => setShowWinPopup(null)} className="btn-play-gold w-full py-4 rounded-full font-black text-black text-xl uppercase tracking-wider">Awesome!</button>
                                </div>
                            </div>
                        )}

                    </div>

                    {/* BOTTOM NAVIGATION */}
                    <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#050505] border-t border-[#dcae45]/30 flex justify-between items-center h-[70px] px-6 z-50 rounded-t-3xl shadow-[0_-10px_25px_rgba(0,0,0,0.9)] backdrop-blur-md">
                        <button onClick={()=>setActiveTab('home')} className={`flex flex-col items-center gap-1 w-10 ${activeTab==='home'?'text-[#ffe29a] drop-shadow-[0_0_8px_rgba(220,174,69,0.8)]':'text-gray-500'}`}><i className="fa-solid fa-house text-xl"></i><span className="text-[10px] font-bold">Home</span></button>
                        <button onClick={()=>setActiveTab('ranking')} className={`flex flex-col items-center gap-1 w-12 ${activeTab==='ranking'?'text-[#ffe29a] drop-shadow-[0_0_8px_rgba(220,174,69,0.8)]':'text-gray-500'}`}><i className="fa-solid fa-ranking-star text-xl"></i><span className="text-[10px] font-bold">Ranking</span></button>
                        <div className="relative -top-6">
                            <button onClick={()=>setActiveTab('wallet')} className={`w-16 h-16 rounded-full flex items-center justify-center border-4 border-[#050505] shadow-[0_0_20px_rgba(220,174,69,0.6)] transition-transform ${activeTab==='wallet'?'bg-gradient-to-b from-[#ffe29a] to-[#dcae45] text-black scale-105':'bg-[#111] text-[#dcae45]'}`}>
                                <i className="fa-solid fa-wallet text-2xl"></i>
                            </button>
                        </div>
                        <button onClick={()=>setActiveTab('refer')} className={`flex flex-col items-center gap-1 w-10 ${activeTab==='refer'?'text-[#ffe29a] drop-shadow-[0_0_8px_rgba(220,174,69,0.8)]':'text-gray-500'}`}><i className="fa-solid fa-gift text-xl"></i><span className="text-[10px] font-bold">Refer</span></button>
                        <button onClick={()=>setActiveTab('profile')} className={`flex flex-col items-center gap-1 w-10 ${activeTab==='profile'?'text-[#ffe29a] drop-shadow-[0_0_8px_rgba(220,174,69,0.8)]':'text-gray-500'}`}><i className="fa-solid fa-user text-xl"></i><span className="text-[10px] font-bold">Profile</span></button>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
